name: smoke

# Render-smoke for the SPA: boots the Next dev server (no backend) and
# checks every public + /app route serves and renders without a client
# crash. This is the guardrail that catches a refactor silently breaking
# a page's bundle (bad import, top-level throw, renamed export). See
# tests/smoke.spec.ts + tests/pages-smoke.spec.ts. A deeper authenticated
# end-to-end pass against a seeded tenant is a separate (Phase 6) task.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.ts"
      - ".github/workflows/smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "playwright.config.ts"
      - ".github/workflows/smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Render-smoke + component-state checks: smoke.spec.ts (public pages),
      # pages-smoke.spec.ts (every /app route serves without a crash), and
      # gallery-smoke.spec.ts (the dev-only /gallery route renders the REAL
      # media components — images/carousel/video/link-preview/composer — with
      # no auth/backend, plus a real dark-toggle click). The visual harness
      # tests/visual/*.spec.ts is a local design-review tool (screenshots, no
      # assertions) — not a CI gate — so it stays excluded here.
      # authed-e2e.spec.ts is the hermetic LOGGED-IN path: it seeds a fake
      # session + selected account and mocks the backend, then drives the
      # Studio dashboard like a real user (boot → tabs → publish dialog →
      # success toast). No real backend, deterministic.
      - run: npx playwright test tests/smoke.spec.ts tests/pages-smoke.spec.ts tests/gallery-smoke.spec.ts tests/authed-e2e.spec.ts
        env:
          # The smoke suite hits no backend; a placeholder keeps the
          # client bundle's NEXT_PUBLIC_API_URL defined at build time.
          NEXT_PUBLIC_API_URL: http://localhost:8000
