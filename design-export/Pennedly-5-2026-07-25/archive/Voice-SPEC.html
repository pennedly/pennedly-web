<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Voice — State Spec · Pennedly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================ DOC CHROME ============================ */
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:#e7e4df; color:#1c1b19;
  font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;}
.doc-head{max-width:1200px; margin:0 auto; padding:46px 40px 8px;}
.doc-kicker{font-family:"Geist Mono",monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#2f4cc4; margin:0 0 12px;}
.doc-title{font-size:38px; line-height:1.05; letter-spacing:-0.025em; font-weight:600; margin:0 0 14px;}
.doc-lede{font-size:16px; line-height:1.6; color:#56544f; max-width:80ch; margin:0 0 8px;}
.doc-lede b{color:#1c1b19; font-weight:600;}
.doc-meta{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0 4px;}
.doc-meta .m{font-family:"Geist Mono",monospace; font-size:11.5px; padding:4px 10px; border-radius:9999px; background:#fff; border:1px solid #d4d1ca; color:#56544f;}
.legend{max-width:1200px; margin:18px auto 0; padding:0 40px; display:flex; flex-wrap:wrap; gap:18px; font-size:12.5px; color:#56544f;}
.legend .lk{display:inline-flex; align-items:center; gap:7px;}
.legend .dot{width:10px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,.15);}

.state-sec{max-width:1200px; margin:8px auto 0; padding:42px 40px 8px;}
.state-sec + .state-sec, .state-sec.divide{border-top:1px solid #d4d1ca; margin-top:22px;}
.sec-num{font-family:"Geist Mono",monospace; font-size:13px; color:#2f4cc4; font-weight:500;}
.sec-title{font-size:25px; line-height:1.2; letter-spacing:-0.015em; font-weight:600; margin:6px 0 8px;}
.sec-title.sub{font-size:19px;}
.sec-desc{font-size:14.5px; line-height:1.6; color:#56544f; max-width:82ch; margin:0 0 6px;}
.sec-desc code{font-family:"Geist Mono",monospace; font-size:0.86em; background:#dedbd4; padding:1px 5px; border-radius:5px;}
.sec-notes{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px;}
.sec-notes li{position:relative; padding-left:20px; font-size:13px; line-height:1.55; color:#56544f; max-width:86ch;}
.sec-notes li::before{content:"›"; position:absolute; left:4px; top:0; color:#2f4cc4; font-weight:700;}
.sec-notes li b{color:#1c1b19; font-weight:600;}
.sec-notes code{font-family:"Geist Mono",monospace; font-size:0.85em; background:#dedbd4; padding:1px 5px; border-radius:5px;}

.gallery{max-width:1200px; margin:0 auto; padding:22px 40px 12px; display:flex; flex-wrap:wrap; gap:32px 34px; align-items:flex-start;}
.vp{margin:0;}
.vp figcaption{display:flex; align-items:center; gap:9px; margin:0 0 10px; font-size:12px; color:#56544f; flex-wrap:wrap;}
.vp figcaption .tg{font-family:"Geist Mono",monospace; font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid #d4d1ca; background:#fff;}
.vp figcaption .tg--web{color:#1c1b19;}
.vp figcaption .tg--mob{color:#2f4cc4; border-color:#c2c8ef; background:#eef0fb;}
.vp figcaption .tg--light{color:#7b6a2a; border-color:#e3dcc4; background:#f7f2e4;}
.vp figcaption .tg--dark{color:#cfcfe6; border-color:#3a3a52; background:#26263a;}
.vp figcaption .lbl{font-weight:500; color:#1c1b19;}

.screen{border-radius:16px; overflow:hidden; position:relative; box-shadow:0 18px 50px -20px rgba(20,18,15,.5), 0 4px 12px -6px rgba(20,18,15,.25);}
.screen.web{width:1060px;}
.screen.mob{width:392px; border-radius:30px; box-shadow:0 18px 50px -18px rgba(20,18,15,.55), 0 0 0 9px #15140f, 0 0 0 10px #2a2925;}
@media (max-width:1160px){ .screen.web{width:100%; max-width:940px;} }
.screen, .screen *{box-sizing:border-box;}

/* =============== PENNEDLY TOKENS (scoped per .screen) =============== */
.screen{
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --color-ink-50:#f9f8f6; --color-ink-100:#ededed; --color-ink-200:#ddddda; --color-ink-300:#c8c7c3;
  --color-ink-400:#a2a19c; --color-ink-500:#7b7a74; --color-ink-600:#565550; --color-ink-700:#3c3b37;
  --color-ink-800:#262521; --color-ink-900:#171717; --color-ink-950:#0a0a0a;
  --color-bg:#efedea; --color-surface:#ffffff; --color-surface-2:#f6f5f2; --color-border:#dcd9d2;
  --color-text:#171717; --color-text-muted:#565550; --color-text-subtle:#6f6e69;
  --color-primary:#171717; --color-primary-foreground:#ededed;
  --color-accent:#2f4cc4; --color-accent-foreground:#ffffff;
  --color-success:#2c7350; --color-success-foreground:#ffffff;
  --color-warning:#8a5b16; --color-warning-foreground:#ffffff;
  --color-danger:#b23b30; --color-danger-foreground:#ffffff;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-2xl:28px; --radius-full:9999px;
  --shadow-sm:0 1px 2px 0 rgb(23 23 23 / 0.06);
  --shadow-md:0 4px 12px -2px rgb(23 23 23 / 0.08), 0 2px 6px -3px rgb(23 23 23 / 0.06);
  --shadow-lg:0 16px 40px -12px rgb(23 23 23 / 0.16), 0 6px 14px -8px rgb(23 23 23 / 0.08);
  --text-display:3rem; --text-h1:2rem; --text-h2:1.5rem; --text-h3:1.1875rem;
  --text-body:0.9375rem; --text-small:0.8125rem; --text-caption:0.75rem;
  --content-reading:720px; --content-wide:960px;
  --ease-standard:cubic-bezier(0.2,0.7,0.3,1); --ease-entrance:cubic-bezier(0.16,1,0.3,1);
  --duration-fast:120ms; --duration-base:180ms; --duration-slow:240ms;
  font-family:var(--font-sans);
}
.screen.pd-dark{
  --color-bg:#0a0a0a; --color-surface:#171717; --color-surface-2:#201f1d; --color-border:#2b2a27;
  --color-text:#ededed; --color-text-muted:#a2a19c; --color-text-subtle:#898882;
  --color-primary:#ededed; --color-primary-foreground:#171717;
  --color-accent:#9aacff; --color-accent-foreground:#0a0a0a;
  --color-success:#5fbf8d; --color-success-foreground:#0a0a0a;
  --color-warning:#d8a754; --color-warning-foreground:#0a0a0a;
  --color-danger:#ef8a80; --color-danger-foreground:#0a0a0a;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-md:0 6px 16px -4px rgb(0 0 0 / 0.6);
  --shadow-lg:0 20px 48px -16px rgb(0 0 0 / 0.7);
}

/* ===================== SHELL (studio.css subset) ===================== */
.screen .app{display:flex; height:100%; background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans); line-height:1.5;}
.screen .sidebar{flex:0 0 248px; display:flex; flex-direction:column; gap:4px; padding:16px 14px; border-right:1px solid var(--color-border); background:var(--color-bg);}
.screen .brand{display:flex; align-items:center; gap:11px; padding:8px 8px 16px;}
.screen .brand-mark{width:34px; height:34px; flex:0 0 auto; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); display:grid; place-items:center; background:var(--color-text); color:var(--color-bg);}
.screen .brand-name{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.01em; line-height:1;}
.screen .brand-sub{font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:3px;}
.screen .nav{display:flex; flex-direction:column; gap:2px;}
.screen .nav-cap{font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle); padding:14px 12px 6px;}
.screen .nav-item{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--radius-md); font-size:var(--text-small); font-weight:500; color:var(--color-text-muted); border:1px solid transparent; position:relative; cursor:pointer; text-decoration:none;}
.screen .nav-item:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .nav-item--active{background:var(--color-surface-2); color:var(--color-text); font-weight:600;}
.screen .nav-item .nav-ico{width:16px; height:16px; flex:0 0 auto; opacity:0.85;}
.screen .nav-item .nav-label{white-space:nowrap;}
.screen .nav-item .nav-badge{margin-left:auto; font-size:var(--text-caption); font-weight:600; color:var(--color-text-subtle); background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-full); min-width:20px; height:18px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;}
.screen .nav-item--active .nav-badge{color:var(--color-text);}
.screen .sidebar-foot{margin-top:auto; padding-top:10px; position:relative;}
.screen .account{display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; color:var(--color-text); cursor:pointer; text-align:left;}
.screen .account:hover{background:var(--color-surface-2);}
.screen .account .who{min-width:0;}
.screen .account .who .nm{font-size:var(--text-small); font-weight:600; line-height:1.2;}
.screen .account .who .hd{font-size:var(--text-caption); color:var(--color-text-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .account .chev{margin-left:auto; color:var(--color-text-subtle); flex:0 0 auto;}
.screen .avatar{position:relative; flex:0 0 auto; border-radius:var(--radius-full); overflow:hidden; display:grid; place-items:center; user-select:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-text) 8%, transparent);}
.screen .avatar-mono{width:100%; height:100%; display:grid; place-items:center; background:var(--color-text); color:var(--color-bg); font-weight:600; letter-spacing:0.01em;}
.screen .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
.screen .topbar{flex:0 0 auto; display:flex; align-items:center; gap:16px; height:60px; padding:0 24px; border-bottom:1px solid var(--color-border); background:color-mix(in srgb, var(--color-bg) 86%, transparent); position:sticky; top:0; z-index:10;}
.screen .topbar:has(> .topbar-inner){padding-inline:0;}
.screen .topbar-inner{width:100%; max-width:var(--content-reading); margin-inline:auto; padding-inline:24px; display:flex; align-items:center; gap:16px;}
.screen .topbar-title{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.006em;}
.screen .topbar-spacer{flex:1 1 auto;}
.screen .topbar-actions{display:flex; align-items:center; gap:8px;}
.screen .icon-btn{width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center; border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-muted); cursor:pointer; text-decoration:none;}
.screen .icon-btn:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .scroll{flex:1 1 auto; overflow:hidden;}
.screen .content{max-width:var(--content-reading); margin:0 auto; padding:28px 24px 40px; display:flex; flex-direction:column; gap:20px;}

/* buttons / pills / badges / fields */
.screen .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-sans); font-weight:500; font-size:var(--text-small); white-space:nowrap; cursor:pointer; user-select:none; border:1px solid transparent; border-radius:var(--radius-md); height:40px; padding-inline:16px; text-decoration:none;}
.screen .btn--sm{height:32px; padding-inline:12px; border-radius:var(--radius-sm);}
.screen .btn--lg{height:46px; padding-inline:22px; font-size:var(--text-body); border-radius:var(--radius-lg);}
.screen .btn--primary{background:var(--color-primary); color:var(--color-primary-foreground);}
.screen .btn--secondary{background:var(--color-surface); color:var(--color-text); border-color:var(--color-border);}
.screen .btn--secondary:hover{background:var(--color-surface-2);}
.screen .btn--ghost{background:transparent; color:var(--color-text-muted);}
.screen .btn--ghost:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .btn:disabled{opacity:0.5; cursor:not-allowed;}
.screen .btn .spinner{width:14px; height:14px; border-radius:var(--radius-full); border:2px solid currentColor; border-top-color:transparent; animation:spin 0.6s linear infinite;}
.screen .status-pill{display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-size:var(--text-small); color:var(--color-text-muted); padding:5px 11px 5px 9px; border:1px solid var(--color-border); border-radius:var(--radius-full); background:var(--color-surface);}
.screen .status-pill .pill-dot{width:7px; height:7px;}
.screen .pill-dot{width:6px; height:6px; border-radius:var(--radius-full); background:currentColor;}
.screen .status-pill--accent{color:var(--color-accent); border-color:color-mix(in srgb, var(--color-accent) 30%, var(--color-border));}
.screen .status-pill--accent .pill-dot{background:var(--color-accent);}
.screen .status-pill--success{color:var(--color-success); border-color:color-mix(in srgb, var(--color-success) 30%, var(--color-border));}
.screen .status-pill--success .pill-dot{background:var(--color-success);}
.screen .status-pill--warning{color:var(--color-warning); border-color:color-mix(in srgb, var(--color-warning) 30%, var(--color-border));}
.screen .status-pill--warning .pill-dot{background:var(--color-warning);}

/* overlay / dialog / toast */
.screen .overlay{position:absolute; inset:0; display:grid; place-items:center; padding:24px; background:color-mix(in srgb, var(--color-ink-950) 55%, transparent); backdrop-filter:blur(3px); z-index:30;}
.screen .dialog{width:100%; max-width:420px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-2xl); box-shadow:var(--shadow-lg); padding:24px;}
.screen .toast-host{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:10px; z-index:60;}
.screen .toast{display:flex; align-items:flex-start; gap:12px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:14px 16px; min-width:280px;}
.screen .toast .toast-mark{width:8px; height:8px; border-radius:var(--radius-full); margin-top:6px; flex:0 0 auto;}
.screen .toast--success .toast-mark{background:var(--color-success);}
.screen .toast .toast-body{min-width:0;}
.screen .toast .toast-title{font-size:var(--text-small); font-weight:600;}
.screen .toast .toast-sub{font-size:var(--text-caption); color:var(--color-text-muted); margin-top:2px;}
.screen .toast .toast-undo{margin-left:8px; font-size:var(--text-small); font-weight:600; color:var(--color-accent); background:none; border:none; cursor:pointer; padding:2px 4px;}

/* ===================== VOICE.CSS (verbatim, scoped) ===================== */
.screen .vhero{position:relative; overflow:hidden; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:24px 24px 22px;}
.screen .vhero-eyebrow{display:inline-flex; align-items:center; gap:7px; font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle);}
.screen .vhero-eyebrow .vh-ico{color:var(--color-text-muted);}
.screen .vhero-row{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-top:12px;}
.screen .vhero-title{font-size:var(--text-h1); font-weight:600; letter-spacing:-0.015em; margin:0;}
.screen .vhero-title em{font-style:normal; color:var(--color-text-muted);}
.screen .vhero-meta{display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px; margin-top:12px;}
.screen .vmeta{display:inline-flex; align-items:center; gap:7px; font-size:var(--text-small); color:var(--color-text-muted); white-space:nowrap;}
.screen .vmeta b{font-weight:600; color:var(--color-text); font-variant-numeric:tabular-nums;}
.screen .vmeta .sep{width:3px; height:3px; border-radius:50%; background:var(--color-ink-400);}
.screen .vhero-actions{display:flex; align-items:center; gap:10px; margin-top:20px; flex-wrap:wrap;}

.screen .langmenu{position:relative; flex:0 0 auto;}
.screen .lm-btn{display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 10px; font-family:var(--font-sans); font-size:var(--text-small); font-weight:500; color:var(--color-text-muted); background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); cursor:pointer;}
.screen .lm-btn:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .lm-btn--sm{height:30px; font-size:var(--text-caption); padding:0 9px;}
.screen .lm-cur{white-space:nowrap;}
.screen .lm-btn .lm-chev{color:var(--color-text-subtle);}
.screen .lm-btn.is-open .lm-chev{transform:rotate(180deg);}
.screen .lm-pop{position:absolute; right:0; top:calc(100% + 6px); z-index:40; min-width:224px; padding:6px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); display:flex; flex-direction:column; gap:2px;}
.screen .lm-item{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; cursor:pointer; text-align:left; color:var(--color-text);}
.screen .lm-item:hover{background:var(--color-surface-2);}
.screen .lm-item.is-on{background:var(--color-surface-2);}
.screen .lm-names{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px;}
.screen .lm-native{font-size:var(--text-small); font-weight:600; line-height:1.2;}
.screen .lm-label{font-size:var(--text-caption); color:var(--color-text-subtle);}
.screen .lm-check{color:var(--color-success); flex:0 0 auto;}

.screen .tbanner{display:flex; align-items:center; gap:13px; padding:13px 16px; background:color-mix(in srgb, var(--color-accent) 8%, var(--color-surface)); border:1px solid color-mix(in srgb, var(--color-accent) 28%, var(--color-border)); border-radius:var(--radius-lg);}
.screen .tbanner .tb-ico{color:var(--color-accent); flex:0 0 auto;}
.screen .tbanner .tb-text{flex:1 1 auto; min-width:0; font-size:var(--text-small); color:var(--color-text-muted); line-height:1.5; text-wrap:pretty;}
.screen .tbanner .tb-text b{color:var(--color-text); font-weight:600;}
.screen .tbanner .btn{flex:0 0 auto;}

.screen .vcheck{background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden;}
.screen .vcheck-head{display:flex; align-items:center; gap:12px; padding:15px 18px; border-bottom:1px solid var(--color-border);}
.screen .vcheck-mark{flex:0 0 auto; width:36px; height:36px; border-radius:var(--radius-md); display:grid; place-items:center; background:color-mix(in srgb, var(--color-warning) 13%, var(--color-surface)); color:var(--color-warning); border:1px solid color-mix(in srgb, var(--color-warning) 26%, transparent);}
.screen .vcheck--clear .vcheck-mark{background:color-mix(in srgb, var(--color-success) 13%, var(--color-surface)); color:var(--color-success); border-color:color-mix(in srgb, var(--color-success) 26%, transparent);}
.screen .vcheck-h{flex:1 1 auto; min-width:0;}
.screen .vcheck-h .t{font-size:var(--text-h3); font-weight:600; line-height:1.25;}
.screen .vcheck-h .s{font-size:var(--text-small); color:var(--color-text-muted); margin-top:2px;}
.screen .vcheck-foot{display:flex; align-items:center; gap:10px; padding:13px 18px; border-top:1px solid var(--color-border);}
.screen .vcheck-foot .lastrun{font-size:var(--text-caption); color:var(--color-text-subtle);}
.screen .conflicts{display:flex; flex-direction:column;}
.screen .conflict{padding:18px; border-bottom:1px solid var(--color-border);}
.screen .conflict:last-child{border-bottom:none;}
.screen .conflict-top{display:flex; align-items:center; gap:9px;}
.screen .sev{display:inline-flex; align-items:center; gap:6px; font-size:var(--text-caption); font-weight:600; letter-spacing:0.03em; text-transform:uppercase;}
.screen .sev .sdot{width:8px; height:8px; border-radius:var(--radius-full); flex:0 0 auto;}
.screen .sev--caution{color:var(--color-warning);}
.screen .sev--caution .sdot{background:var(--color-warning);}
.screen .sev--conflict{color:var(--color-danger);}
.screen .sev--conflict .sdot{background:var(--color-danger);}
.screen .conflict-top .ct-spacer{flex:1 1 auto;}
.screen .conflict-dismiss{font-size:var(--text-caption); color:var(--color-text-subtle); background:none; border:none; cursor:pointer; padding:4px 6px; border-radius:var(--radius-sm);}
.screen .conflict-dismiss:hover{color:var(--color-text); background:var(--color-surface-2);}
.screen .conflict-title{font-size:var(--text-h3); font-weight:600; margin:10px 0 0; letter-spacing:-0.004em;}
.screen .conflict-rules{display:flex; flex-direction:column; gap:8px; margin:13px 0 0;}
.screen .crule{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; padding:10px 12px; background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md);}
.screen .crule .clabel{font-size:var(--text-caption); font-weight:600; color:var(--color-text-subtle); white-space:nowrap; padding-top:1px;}

/* ===================== hero ===================== */
function hero(opts){
 opts=opts||{};
 var lang=opts.lang||'en', busy=opts.busy, translated=lang!=='en', checking=opts.checking;
 var dis=(busy||translated||checking)?' disabled':'';
 var langBtn='<div class="langmenu"><button class="lm-btn'+(opts.langOpen?' is-open':'')+'">'+I('globe',16)+'<span class="lm-cur">'+(lang==='en'?'Original':'Deutsch')+'</span>'+I('chevD',14)+'<span class="lm-chev" style="display:none"></span></button>'+(opts.langOpen?langPop(lang):'')+'</div>';
 var checkBtn = checking
   ? '<button class="btn btn--secondary" disabled><span class="spinner"></span> Checking…</button>'
   : '<button class="btn btn--secondary"'+dis+'>'+I('scan',16)+' Check voice</button>';
 return '<div class="vhero">'
  +'<span class="vhero-eyebrow">'+I('voice',14)+' Account voice</span>'
  +'<div class="vhero-row"><h1 class="vhero-title">How <em>Mara Lin</em> sounds</h1>'+langBtn+'</div>'
  +'<div class="vhero-meta"><span class="vmeta">Extracted from <b>312</b> posts</span><span class="sep"></span><span class="vmeta">Updated <b>'+(opts.updated||'3 days ago')+'</b></span></div>'
  +'<div class="vhero-actions">'+checkBtn+'<button class="btn btn--secondary"'+dis+'>'+I('refresh',16)+' Re-extract</button></div>'
 +'</div>';
}
function langPop(lang){
 var rows=[['en','English','Original · editable'],['es','Español','Spanish'],['de','Deutsch','German']].map(function(r){
  var on=r[0]===lang;
  return '<button class="lm-item'+(on?' is-on':'')+'"><span class="lm-names"><span class="lm-native">'+r[1]+'</span><span class="lm-label">'+r[2]+'</span></span>'+(on?'<span class="lm-check">'+I('check',15)+'</span>':'')+'</button>';
 }).join('');
 return '<div class="lm-pop" role="menu">'+rows+'</div>';
}

/* ===================== section shell ===================== */
function secHead(icon,title,desc,count,opts){
 opts=opts||{};
 var cnt=count!=null?'<span class="count">'+count+'</span>':'';
 var edit=(!opts.editing&&!opts.readOnly)?'<button class="vsec-edit">'+I('pencil',15)+' Edit</button>':'';
 if(opts.editLabel) edit='<button class="vsec-edit">'+opts.editLabel+'</button>';
 return '<div class="vsec-head"><span class="vsec-mark">'+icon+'</span><div class="vsec-ttl"><div class="h">'+esc(title)+cnt+'</div><div class="d">'+esc(desc)+'</div></div>'+edit+'</div>';
}
function secFoot(note){
 return '<div class="vsec-foot">'+(note?'<span class="foot-note">'+esc(note)+'</span>':'')+'<button class="btn btn--ghost btn--sm">Cancel</button><button class="btn btn--primary btn--sm">'+I('check',15)+' Save changes</button></div>';
}

/* ---- 1 intro ---- */
function secIntro(lang,o){
 o=o||{};
 var body = o.editing
   ? '<textarea class="intro-edit">'+esc(INTRO.en)+'</textarea>'
   : '<p class="intro-text">'+esc(INTRO[lang]||INTRO.en)+'</p>';
 return '<section class="vsec'+(o.editing?' vsec--editing':'')+'">'+secHead(I('voice',17),'In a sentence','The through-line a draft should always hit',null,o)+'<div class="vsec-body">'+body+'</div>'+(o.editing?secFoot('This frames every draft Pennedly writes.'):'')+'</section>';
}

/* ---- 2/3 themes ---- */
function secThemes(items,exclude,lang,o){
 o=o||{};
 var icon=exclude?I('alert',17):I('tags',17);
 var title=exclude?"Won't write about":'Themes to write about';
 var desc=exclude?'Topics Pennedly should steer every draft away from':'The subjects this account returns to';
 var tone=exclude?' vsec--exclude':'';
 var body;
 if(o.editing){
  var rows=items.map(function(t){
   return '<div class="edit-row"><div class="er-fields"><input class="inp inp--strong" value="'+esc(L(t,lang,'label'))+'"><input class="inp inp--note" value="'+esc(L(t,lang,'note'))+'"></div><button class="er-del">'+I('trash',16)+'</button></div>';
  }).join('');
  body=rows+'<button class="add-row">'+I('plus',15)+' '+(exclude?'Add a topic to avoid':'Add a theme')+'</button>';
  body='<div class="edit-list">'+rows+'</div><button class="add-row">'+I('plus',15)+' '+(exclude?'Add a topic to avoid':'Add a theme')+'</button>';
 } else {
  body='<div class="themes">'+items.map(function(t){
   var note=L(t,lang,'note');
   return '<div class="theme-row'+(exclude?' theme-row--x':'')+'"><span class="th-label"><span class="th-bullet"></span>'+esc(L(t,lang,'label'))+'</span>'+(note?'<span class="th-note">'+esc(note)+'</span>':'')+'</div>';
  }).join('')+'</div>';
 }
 return '<section class="vsec'+tone+(o.editing?' vsec--editing':'')+'">'+secHead(icon,title,desc,items.length,o)+'<div class="vsec-body">'+body+'</div>'+(o.editing?secFoot(''):'')+'</section>';
}

/* ---- 4 characteristics ---- */
function secChars(items,lang,o){
 o=o||{};
 var body='<div class="traits">'+items.map(function(t){
  var fl=FLAGS.has('characteristics:'+t.id)&&o.flags?' is-flagged':'';
  return '<div class="trait-row'+fl+'"><span class="trait-kind">'+esc(L(t,lang,'label'))+'</span><span class="trait-text">'+esc(L(t,lang,'text'))+'</span></div>';
 }).join('')+'</div>';
 return '<section class="vsec">'+secHead(I('list',17),'Voice characteristics','How a draft should feel to read',items.length,o)+'<div class="vsec-body">'+body+'</div></section>';
}

/* ---- 5/6 rules ---- */
function secRules(items,negative,sectionKey,lang,o){
 o=o||{};
 var icon=negative?I('x',17):I('check',17);
 var title=negative?"Don't":'Do';
 var desc=negative?'Hard rules a draft must never break':'Hard rules a draft must always follow';
 var tone=negative?' vsec--dont':' vsec--do';
 var body='<ul class="rules">'+items.map(function(r){
  var fl=(FLAGS.has(sectionKey+':'+r.id)&&o.flags)?' is-flagged':'';
  return '<li class="rule '+(negative?'rule--no':'rule--yes')+fl+'"><span class="rule-tick">'+(negative?I('x',13):I('check',13))+'</span><span class="rule-text">'+esc(L(r,lang,'text'))+'</span></li>';
 }).join('')+'</ul>';
 return '<section class="vsec'+tone+'">'+secHead(icon,title,desc,items.length,o)+'<div class="vsec-body">'+body+'</div></section>';
}

/* ---- 7 examples ---- */
function secExamples(items,lang,o){
 o=o||{};
 var body='<div class="examples">'+items.map(function(x){
  var fl=(FLAGS.has('examples:'+x.id)&&o.flags)?' is-flagged':'';
  return '<div class="ex'+fl+'"><div class="ex-meta"><span class="ex-kind">'+esc(x.context)+'</span>'+(x.stat?'<span class="ex-dot"></span><span>'+esc(x.stat)+'</span>':'')+'</div><div class="ex-text">'+esc(L(x,lang,'text'))+'</div></div>';
 }).join('')+'</div>';
 return '<section class="vsec">'+secHead(I('quote',17),'Example posts','Real posts that show the voice in motion',items.length,o)+'<div class="vsec-body">'+body+'</div></section>';
}

/* ---- voice check ---- */
function conflictCard(c){
 var sev=c.severity, lab=sev==='conflict'?'Conflict':'Caution';
 var parts=c.parts.map(function(p){return '<div class="crule"><span class="clabel">'+esc(p.label)+'</span><span class="ctext">'+esc(p.text)+'</span></div>';}).join('');
 return '<div class="conflict"><div class="conflict-top"><span class="sev sev--'+sev+'"><span class="sdot"></span>'+lab+'</span><span class="ct-spacer"></span><button class="conflict-dismiss">Ignore</button></div>'
  +'<div class="conflict-title">'+esc(c.title)+'</div>'
  +'<div class="conflict-rules">'+parts+'</div>'
  +'<p class="conflict-why">'+esc(c.why)+'</p>'
  +'<div class="conflict-fix"><div class="fix-body"><div class="fix-cap">Suggested fix</div><div class="fix-text">'+esc(c.fix)+'</div></div><button class="btn btn--primary btn--sm">'+I('check',15)+' Apply fix</button></div>'
 +'</div>';
}
function voiceCheck(clear){
 if(clear){
  return '<section class="vcheck vcheck--clear"><div class="vcheck-head"><span class="vcheck-mark">'+I('shield',18)+'</span><div class="vcheck-h"><div class="t">Your voice is consistent</div><div class="s">No rules contradict each other. Drafts have one clear set of instructions to follow.</div></div></div><div class="vcheck-foot"><span class="lastrun">Last checked just now</span><span style="flex:1"></span><button class="btn btn--ghost btn--sm">'+I('refresh',15)+' Re-check</button></div></section>';
 }
 var n=CONFLICTS.length;
 return '<section class="vcheck"><div class="vcheck-head"><span class="vcheck-mark">'+I('scan',18)+'</span><div class="vcheck-h"><div class="t">'+n+' things to resolve</div><div class="s">A rule disagrees with another rule or example. Each fix is one click, review before you apply.</div></div></div>'
  +'<div class="conflicts">'+CONFLICTS.map(conflictCard).join('')+'</div>'
  +'<div class="vcheck-foot"><span class="lastrun">Last checked just now</span><span style="flex:1"></span><button class="btn btn--ghost btn--sm">'+I('refresh',15)+' Re-check</button></div></section>';
}

/* ---- re-extract ---- */
function reextract(step){
 var rows=STEPS.map(function(label,i){
  var st=i<step?'done':i===step?'active':'';
  var tick=i<step?I('check',13):i===step?'<span class="sp"></span>':'<span style="width:5px;height:5px;border-radius:9px;background:currentColor;opacity:0.5"></span>';
  return '<div class="rx-step '+st+'"><span class="rx-tick">'+tick+'</span><span class="rx-label">'+esc(label)+'</span></div>';
 }).join('');
 return '<div class="reextract"><span class="rx-nib">'+I('nib',40)+'</span><div class="rx-title">Re-reading your voice</div><div class="rx-sub">Pennedly is studying your recent posts again. Your current voice stays live until this finishes.</div><div class="rx-steps">'+rows+'</div></div>';
}

/* ---- prompt preview ---- */
function assemblePrompt(lang){
 function PL(k){var en={heading:'VOICE PROFILE',intro:'Voice summary',themesInclude:'Write about',themesExclude:'Never write about',characteristics:'Voice characteristics',doo:'Always',dont:'Never',examples:'Reference posts, match their rhythm and length'};return en[k];}
 var o=[];o.push('VOICE PROFILE');o.push('');
 o.push('# '+PL('intro')); o.push(INTRO.en); o.push('');
 o.push('# '+PL('themesInclude')); TI.forEach(function(x){o.push('- '+x.label+': '+x.note);}); o.push('');
 o.push('# '+PL('themesExclude')); TX.forEach(function(x){o.push('- '+x.label);}); o.push('');
 o.push('# '+PL('characteristics')); CH.forEach(function(x){o.push('- '+x.label+': '+x.text);}); o.push('');
 o.push('# '+PL('doo')); DO.forEach(function(x){o.push('- '+x.text);}); o.push('');
 o.push('# '+PL('dont')); DN.forEach(function(x){o.push('- '+x.text);}); o.push('');
 o.push('# '+PL('examples')); EX.forEach(function(x,i){o.push((i+1)+'. '+x.text);});
 return o.join('\n');
}
function promptSec(open){
 var head='<div class="vsec-head"><span class="vsec-mark">'+I('sparkle',17)+'</span><div class="vsec-ttl"><div class="h">What the AI actually sees</div><div class="d">Your sections, assembled into the exact instructions Pennedly receives</div></div><button class="vsec-edit">'+I('chevD',15)+' '+(open?'Hide':'Show')+'</button></div>';
 var body= open ? '<div class="vsec-body"><div class="prompt-tools"><span class="prompt-note">Read-only · generated from the sections above</span><span style="flex:1"></span><div class="langmenu"><button class="lm-btn lm-btn--sm">'+I('globe',15)+'<span class="lm-cur">Original</span>'+I('chevD',14)+'</button></div></div><pre class="prompt-pre">'+esc(assemblePrompt('en'))+'</pre></div>' : '';
 return '<section class="vsec prompt-sec">'+head+body+'</section>';
}

/* ===================== full bodies ===================== */
function bodyPopulated(lang){
 lang=lang||'en';
 return hero({lang:lang,updated:'3 days ago'})
  +secIntro(lang,{})
  +secThemes(TI,false,lang,{})
  +secThemes(TX,true,lang,{})
  +secChars(CH,lang,{})
  +secRules(DO,false,'do',lang,{})
  +secRules(DN,true,'dont',lang,{})
  +secExamples(EX,lang,{})
  +promptSec(false);
}
function bodyEditing(){
 return hero({})
  +secIntro('en',{editing:true})
  +secThemes(TI,false,'en',{editing:true})
  +secThemes(TX,true,'en',{});
}
function bodyConflicts(){
 return hero({})
  +voiceCheck(false)
  +secRules(DO,false,'do','en',{flags:true})
  +secRules(DN,true,'dont','en',{flags:true})
  +secExamples(EX,'en',{flags:true});
}
function bodyAllClear(){
 return hero({})+voiceCheck(true)+secRules(DO,false,'do','en',{})+secRules(DN,true,'dont','en',{});
}
function bodyReextract(){
 return hero({busy:true,updated:'3 days ago'})+reextract(2);
}
function bodyTranslated(){
 return hero({lang:'de'})
  +tbanner()
  +secIntro('de',{readOnly:true})
  +secThemes(TI,false,'de',{readOnly:true})
  +secThemes(TX,true,'de',{readOnly:true})
  +secChars(CH,'de',{readOnly:true})
  +secRules(DO,false,'do','de',{readOnly:true})
  +secRules(DN,true,'dont','de',{readOnly:true})
  +secExamples(EX,'de',{readOnly:true})
  +promptSec(false);
}
function bodyPrompt(){
 return hero({})+promptSec(true);
}
function bodyEmpty(){ return emptyVoice(); }
function bodyDialog(){ return bodyPopulated('en').replace('</div></div></div>','') ; }

/* ===================== frames ===================== */
function frame(device,theme,label,body,tone,pill,extraHtml){
 var dark=theme==='dark';
 var screen='<div class="screen '+device+' pd-'+theme+'">'+app(body,tone,pill,dark)+(extraHtml||'')+'</div>';
 return '<figure class="vp"><figcaption><span class="tg tg--'+(device==='web'?'web':'mob')+'">'+(device==='web'?'Web · 1060':'Mobile · 392')+'</span><span class="tg tg--'+theme+'">'+(dark?'Dark':'Light')+'</span><span class="lbl">'+label+'</span></figcaption>'+screen+'</figure>';
}
function sectionHead(num,title,desc,notes,sub){
 var noteList=(notes||[]).map(function(n){return '<li>'+n+'</li>';}).join('');
 return '<section class="state-sec'+(sub?'':' divide')+'"><div class="sec-num">'+num+'</div><h2 class="sec-title'+(sub?' sub':'')+'">'+title+'</h2><p class="sec-desc">'+desc+'</p>'+(noteList?'<ul class="sec-notes">'+noteList+'</ul>':'')+'</section>';
}
function gallery(frames){ return '<div class="gallery">'+frames+'</div>'; }

/* ===================== build ===================== */
var H='';
H+='<header class="doc-head">'
 +'<p class="doc-kicker">Pennedly · State spec · build contract</p>'
 +'<h1 class="doc-title">Voice · the role-book, every state rendered</h1>'
 +'<div style="border:1px solid #d8c9a6; background:#f7f1e1; border-radius:12px; padding:13px 16px; margin:0 0 16px; max-width:80ch; font-size:13.5px; line-height:1.55; color:#5b5232;"><b style="color:#3f3a22;">Исторический документ.</b> Экран перестроен 30.06.2026: «Стиль» стал вкладкой «Анти-робот» внутри «Голоса». Актуальная спецификация: <a href="../screens/role-book/Voice-Tabs-SPEC.html" style="color:#2f4cc4; font-weight:600;">Voice-Tabs-SPEC.html</a>.</div>'
 +'<p class="doc-lede">Full-fidelity render of <b>Voice</b> (<code>/app/role-book</code>), where the user reads and edits the voice Pennedly writes in. The voice is <b>seven editable sections</b>. There is deliberately <b>no voice match %</b> anywhere; the hero reports what the voice was learned from, not a score. Every frame uses the real PennedlyDesign tokens, the shared app shell, and the real copy from <code>voice-data.jsx</code> (Mara Lin). Reading width is <b>720px</b>. Each state is labeled and shown for <b>web + mobile</b> in <b>light + dark</b>. All em-dashes are stripped from copy per house style.</p>'
 +'<div class="doc-meta"><span class="m">route /app/role-book</span><span class="m">sidebar: Voice (mic)</span><span class="m">width 720</span><span class="m">7 sections</span><span class="m">no match %</span><span class="m">states: ready · edit · check · re-extract · translated · prompt · empty</span></div>'
 +'</header>'
 +'<div class="legend"><span class="lk"><span class="dot" style="background:#2c7350;"></span>do / in-sync / done</span><span class="lk"><span class="dot" style="background:#b23b30;"></span>don\u2019t / exclude / conflict</span><span class="lk"><span class="dot" style="background:#8a5b16;"></span>caution / flagged row</span><span class="lk"><span class="dot" style="background:#2f4cc4;"></span>accent / translated / fix</span></div>';

// 1 - populated
H+=sectionHead('State 1','Populated voice (all seven sections)',
 'The default, in-sync state. Hero reports the source (<code>Extracted from 312 posts · Updated 3 days ago</code>, no score) with the globe language menu and the Check / Re-extract actions. Then the seven sections in order: 1 Intro, 2 Themes to write about, 3 Won\u2019t write about (the red exclude zone), 4 Voice characteristics, 5 Do, 6 Don\u2019t, 7 Example posts, and finally the collapsed \u201CWhat the AI actually sees\u201D prompt preview. Topbar pill reads <code>In sync</code> (success).',
 ['Each section card: icon mark, title with a count chip, a one-line helper caption, its items, and an Edit affordance (hover in the live app). Do is success-toned, Don\u2019t and the exclude zone are danger-toned.',
  'Example 2 ends with an emoji on purpose, it is the seed of the conflict surfaced by Check (State 3).',
  'No \u201Cmatch %\u201D anywhere, the hero meta is provenance, not a grade.']);
H+=gallery(
 frame('web','light','Populated · in sync',bodyPopulated('en'),'success','In sync')
 +frame('web','dark','Populated · in sync',bodyPopulated('en'),'success','In sync')
 +frame('mob','light','Populated · mobile',bodyPopulated('en'),'success','In sync')
 +frame('mob','dark','Populated · mobile',bodyPopulated('en'),'success','In sync')
);

// 2 - edit + add
H+=sectionHead('State 2','Item in edit mode + add item',
 'Per-item editing. A section in edit mode swaps its rows for inline fields with a Save changes / Cancel footer (the card border + shadow lift to accent). Shown: the Intro as one textarea, and Themes to write about as label+note field pairs with a per-row delete and a dashed \u201CAdd a theme\u201D row that appends a blank item in edit mode. Persisting is per item, so a live row briefly shows saving then saved, and an error tone if a save fails.',
 ['Field shapes by section: single text field for Do/Don\u2019t, label+note for themes, label+text for characteristics, context+stat+text for examples, a larger textarea for the intro.',
  'Every add, edit, and delete is its own save through the fix API; delete shows an undo affordance (toast).',
  'Editing is only available on the original English; translated mode hides all of this.']);
H+=gallery(
 frame('web','light','Edit mode · intro + themes',bodyEditing(),'success','In sync')
 +frame('web','dark','Edit mode · intro + themes',bodyEditing(),'success','In sync')
);

// 3 - check conflicts
H+=sectionHead('State 3','Voice check · conflicts',
 'Pressing Check runs the lint and surfaces conflicts between the user\u2019s own rules. Each conflict shows a severity (<b>Caution</b> = a tension, warning tone; <b>Conflict</b> = a contradiction, danger tone), a title, the two implicated parts as \u201Csection, label\u201D + the offending text, a \u201Cwhy this matters\u201D line, and an Apply fix button whose summary describes the exact change. While Check shows, the rows each conflict implicates get a quiet flagged highlight in the sections below. Topbar pill reads <code>2 conflicts</code> (warning).',
 ['Caution c1: the three-sentence cap fights the open-concrete + end-on-a-turn rules, all three Do rows are flagged; the fix relaxes the cap.',
  'Conflict c2: \u201Cno emoji\u201D contradicts the saved example that ends with a smiley, Don\u2019t row dn2 and Example ex2 are flagged; the fix drops the emoji and the conflict clears.',
  'Applying a fix mutates the real voice and the row flash-confirms; Ignore dismisses with an undo.']);
H+=gallery(
 frame('web','light','Check · 2 conflicts + flagged rows',bodyConflicts(),'warning','2 conflicts')
 +frame('web','dark','Check · 2 conflicts + flagged rows',bodyConflicts(),'warning','2 conflicts')
 +frame('mob','light','Check · mobile',bodyConflicts(),'warning','2 conflicts')
);
H+=sectionHead('State 3 · all-clear','Voice check · no conflicts',
 'After every conflict is resolved (or when none exist), the panel collapses to the all-clear state: a shield mark and \u201CYour voice is consistent, no rules contradict each other.\u201D The topbar returns to <code>In sync</code>.',
 null,true);
H+=gallery(
 frame('web','light','All-clear',bodyAllClear(),'success','In sync')
 +frame('web','dark','All-clear',bodyAllClear(),'success','In sync')
);

// 4 - re-extract
H+=sectionHead('State 4','Re-extract in progress',
 'Pressing Re-extract (after a confirm dialog) re-derives the voice from recent posts. The in-progress state replaces the sections with a centered card: the nib pen writing animation, a title and calm sub, and the four re-extract steps as a vertical stepper (done = green check, active = accent spinner, pending = faint dot). On completion it returns to the populated voice with refreshed sections. Topbar pill reads <code>Re-extracting…</code> (accent).',
 ['Captured mid-run with step 3 active; the current voice stays live until this finishes.',
  'Re-extract replaces hand edits, that is why it is gated behind a confirm dialog (shown in the extras below).']);
H+=gallery(
 frame('web','light','Re-extract · running',bodyReextract(),'accent','Re-extracting…')
 +frame('web','dark','Re-extract · running',bodyReextract(),'accent','Re-extracting…')
 +frame('mob','light','Re-extract · mobile',bodyReextract(),'accent','Re-extracting…')
);

// 5 - translated
H+=sectionHead('State 5','Translated read-only view',
 'Picking a non-English language from the globe menu translates the intro and every item field individually and renders the WHOLE voice read-only in that language (shown here in German). A banner sits at the top with a View original button; every edit / add / delete affordance is hidden and Check / Re-extract are disabled. This is a disposable reading layer, it is never written back, and the original English is always what generation uses. Topbar pill reads <code>Translated · Deutsch</code> (accent).',
 ['Section content localizes per item (vLoc) and the intro via INTRO_I18N; only the label is part of the voice for the exclude zone, the note is editor-side guidance (still translated for reading).',
  'Translation is cached per tenant; editing the original supersedes a stale translation.']);
H+=gallery(
 frame('web','light','Translated · German (read-only)',bodyTranslated(),'accent','Translated · Deutsch')
 +frame('web','dark','Translated · German (read-only)',bodyTranslated(),'accent','Translated · Deutsch')
 +frame('mob','light','Translated · mobile',bodyTranslated(),'accent','Translated · Deutsch')
);

// 6 - prompt preview
H+=sectionHead('State 6','Prompt preview · what the AI actually sees',
 'The \u201CWhat the AI actually sees\u201D section expanded: the literal system prompt assembled from the voice (assemblePrompt), rendered monospace and clearly read-only, with a VOICE PROFILE heading then # Voice summary, # Write about, # Never write about, # Voice characteristics, # Always, # Never, # Reference posts and the items under each. It has its own translate control. Shown in both light and the dark reference.',
 ['Generated from the sections 1:1, so it always matches what the model receives, the dark version is the voice-prompt-dark reference.',
  'The exclude zone contributes labels only (no notes); examples are numbered reference posts.']);
H+=gallery(
 frame('web','light','Prompt preview (open)',bodyPrompt(),'success','In sync')
 +frame('web','dark','Prompt preview (open · dark ref)',bodyPrompt(),'success','In sync')
);

// 7 - extras: empty + dialog
H+=sectionHead('State 7 · extras','Empty voice & re-extract confirm',
 'Two supporting states. Left: the empty/first-run voice (no voice learned yet) with an Extract my voice CTA, the real app shows this until a voice exists. Right: the Re-extract confirm dialog that warns hand edits will be replaced, shown over the populated voice.',
 null,true);
H+=gallery(
 frame('web','light','Empty voice',bodyEmpty(),'success','In sync')
 +frame('web','dark','Empty voice',bodyEmpty(),'success','In sync')
 +frame('web','light','Re-extract confirm dialog',bodyPopulated('en'),'success','In sync',reDialog())
);

document.getElementById('root').innerHTML=H;
</script>
</body>
</html>
