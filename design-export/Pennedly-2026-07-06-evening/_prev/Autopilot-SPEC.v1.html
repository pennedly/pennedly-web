<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autopilot — State Spec · Pennedly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================ DOC CHROME ============================ */
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:#e7e4df; color:#1c1b19; font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
.doc-head{max-width:1200px; margin:0 auto; padding:46px 40px 8px;}
.doc-kicker{font-family:"Geist Mono",monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#2f4cc4; margin:0 0 12px;}
.doc-title{font-size:38px; line-height:1.05; letter-spacing:-0.025em; font-weight:600; margin:0 0 14px;}
.doc-lede{font-size:16px; line-height:1.6; color:#56544f; max-width:80ch; margin:0 0 8px;}
.doc-lede b{color:#1c1b19; font-weight:600;}
.doc-meta{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0 4px;}
.doc-meta .m{font-family:"Geist Mono",monospace; font-size:11.5px; padding:4px 10px; border-radius:9999px; background:#fff; border:1px solid #d4d1ca; color:#56544f;}
.legend{max-width:1200px; margin:18px auto 0; padding:0 40px; display:flex; flex-wrap:wrap; gap:18px; font-size:12.5px; color:#56544f;}
.legend .lk{display:inline-flex; align-items:center; gap:7px;}
.legend .dot{width:10px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,.15);}

.state-sec{max-width:1200px; margin:8px auto 0; padding:42px 40px 8px;}
.state-sec + .state-sec, .state-sec.divide{border-top:1px solid #d4d1ca; margin-top:22px;}
.sec-num{font-family:"Geist Mono",monospace; font-size:13px; color:#2f4cc4; font-weight:500;}
.sec-title{font-size:25px; line-height:1.2; letter-spacing:-0.015em; font-weight:600; margin:6px 0 8px;}
.sec-title.sub{font-size:19px;}
.sec-desc{font-size:14.5px; line-height:1.6; color:#56544f; max-width:82ch; margin:0 0 6px;}
.sec-desc code{font-family:"Geist Mono",monospace; font-size:0.86em; background:#dedbd4; padding:1px 5px; border-radius:5px;}
.sec-notes{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px;}
.sec-notes li{position:relative; padding-left:20px; font-size:13px; line-height:1.55; color:#56544f; max-width:86ch;}
.sec-notes li::before{content:"›"; position:absolute; left:4px; top:0; color:#2f4cc4; font-weight:700;}
.sec-notes li b{color:#1c1b19; font-weight:600;}
.sec-notes code{font-family:"Geist Mono",monospace; font-size:0.85em; background:#dedbd4; padding:1px 5px; border-radius:5px;}
.note-card{max-width:1200px; margin:12px auto 0; padding:0 40px;}
.note-card .nc{border:1px solid #d8c9a6; background:#f7f1e1; border-radius:12px; padding:13px 16px; font-size:13.5px; line-height:1.55; color:#5b5232;}
.note-card .nc b{color:#3f3a22;}
.note-card .nc code{font-family:"Geist Mono",monospace; font-size:0.86em; background:#ece3c8; padding:1px 5px; border-radius:5px;}

.gallery{max-width:1200px; margin:0 auto; padding:22px 40px 12px; display:flex; flex-wrap:wrap; gap:32px 34px; align-items:flex-start;}
.vp{margin:0;}
.vp figcaption{display:flex; align-items:center; gap:9px; margin:0 0 10px; font-size:12px; color:#56544f; flex-wrap:wrap;}
.vp figcaption .tg{font-family:"Geist Mono",monospace; font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid #d4d1ca; background:#fff;}
.vp figcaption .tg--web{color:#1c1b19;}
.vp figcaption .tg--mob{color:#2f4cc4; border-color:#c2c8ef; background:#eef0fb;}
.vp figcaption .tg--light{color:#7b6a2a; border-color:#e3dcc4; background:#f7f2e4;}
.vp figcaption .tg--dark{color:#cfcfe6; border-color:#3a3a52; background:#26263a;}
.vp figcaption .lbl{font-weight:500; color:#1c1b19;}

.screen{border-radius:16px; overflow:hidden; position:relative; box-shadow:0 18px 50px -20px rgba(20,18,15,.5), 0 4px 12px -6px rgba(20,18,15,.25);}
.screen.web{width:1060px;}
.screen.mob{width:392px; border-radius:30px; box-shadow:0 18px 50px -18px rgba(20,18,15,.55), 0 0 0 9px #15140f, 0 0 0 10px #2a2925;}
@media (max-width:1160px){ .screen.web{width:100%; max-width:940px;} }
.screen, .screen *{box-sizing:border-box;}

/* =============== PENNEDLY TOKENS (scoped per .screen) =============== */
.screen{
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --color-ink-50:#f9f8f6; --color-ink-100:#ededed; --color-ink-200:#ddddda; --color-ink-300:#c8c7c3;
  --color-ink-400:#a2a19c; --color-ink-500:#7b7a74; --color-ink-600:#565550; --color-ink-700:#3c3b37;
  --color-ink-800:#262521; --color-ink-900:#171717; --color-ink-950:#0a0a0a;
  --color-bg:#efedea; --color-surface:#ffffff; --color-surface-2:#f6f5f2; --color-border:#dcd9d2;
  --color-text:#171717; --color-text-muted:#565550; --color-text-subtle:#6f6e69;
  --color-primary:#171717; --color-primary-foreground:#ededed;
  --color-accent:#2f4cc4; --color-accent-foreground:#ffffff;
  --color-success:#2c7350; --color-success-foreground:#ffffff;
  --color-warning:#8a5b16; --color-warning-foreground:#ffffff;
  --color-danger:#b23b30; --color-danger-foreground:#ffffff;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-2xl:28px; --radius-full:9999px;
  --shadow-sm:0 1px 2px 0 rgb(23 23 23 / 0.06);
  --shadow-md:0 4px 12px -2px rgb(23 23 23 / 0.08), 0 2px 6px -3px rgb(23 23 23 / 0.06);
  --shadow-lg:0 16px 40px -12px rgb(23 23 23 / 0.16), 0 6px 14px -8px rgb(23 23 23 / 0.08);
  --text-display:3rem; --text-h1:2rem; --text-h2:1.5rem; --text-h3:1.1875rem;
  --text-body:0.9375rem; --text-small:0.8125rem; --text-caption:0.75rem;
  --content-reading:720px; --content-wide:960px;
  --ease-standard:cubic-bezier(0.2,0.7,0.3,1); --ease-entrance:cubic-bezier(0.16,1,0.3,1);
  --duration-fast:120ms; --duration-base:180ms; --duration-slow:240ms;
  font-family:var(--font-sans);
}
.screen.pd-dark{
  --color-bg:#0a0a0a; --color-surface:#171717; --color-surface-2:#201f1d; --color-border:#2b2a27;
  --color-text:#ededed; --color-text-muted:#a2a19c; --color-text-subtle:#898882;
  --color-primary:#ededed; --color-primary-foreground:#171717;
  --color-accent:#9aacff; --color-accent-foreground:#0a0a0a;
  --color-success:#5fbf8d; --color-success-foreground:#0a0a0a;
  --color-warning:#d8a754; --color-warning-foreground:#0a0a0a;
  --color-danger:#ef8a80; --color-danger-foreground:#0a0a0a;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-md:0 6px 16px -4px rgb(0 0 0 / 0.6);
  --shadow-lg:0 20px 48px -16px rgb(0 0 0 / 0.7);
}

/* ===================== SHELL ===================== */
.screen .app{display:flex; height:100%; background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans); line-height:1.5;}
.screen .sidebar{flex:0 0 248px; display:flex; flex-direction:column; gap:4px; padding:16px 14px; border-right:1px solid var(--color-border); background:var(--color-bg);}
.screen .brand{display:flex; align-items:center; gap:11px; padding:8px 8px 16px;}
.screen .brand-mark{width:34px; height:34px; flex:0 0 auto; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); display:grid; place-items:center; background:var(--color-text); color:var(--color-bg);}
.screen .brand-name{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.01em; line-height:1;}
.screen .brand-sub{font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:3px;}
.screen .nav{display:flex; flex-direction:column; gap:2px;}
.screen .nav-cap{font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle); padding:14px 12px 6px;}
.screen .nav-item{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--radius-md); font-size:var(--text-small); font-weight:500; color:var(--color-text-muted); border:1px solid transparent; position:relative; cursor:pointer; text-decoration:none;}
.screen .nav-item:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .nav-item--active{background:var(--color-surface-2); color:var(--color-text); font-weight:600;}
.screen .nav-item .nav-ico{width:16px; height:16px; flex:0 0 auto; opacity:0.85;}
.screen .nav-item .nav-label{white-space:nowrap;}
.screen .nav-item .nav-badge{margin-left:auto; font-size:var(--text-caption); font-weight:600; color:var(--color-text-subtle); background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-full); min-width:20px; height:18px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;}
.screen .nav-item--active .nav-badge{color:var(--color-text);}
.screen .sidebar-foot{margin-top:auto; padding-top:10px; position:relative;}
.screen .account{display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; color:var(--color-text); cursor:pointer; text-align:left;}
.screen .account:hover{background:var(--color-surface-2);}
.screen .account .who{min-width:0;}
.screen .account .who .nm{font-size:var(--text-small); font-weight:600; line-height:1.2;}
.screen .account .who .hd{font-size:var(--text-caption); color:var(--color-text-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .account .chev{margin-left:auto; color:var(--color-text-subtle); flex:0 0 auto;}
.screen .avatar{position:relative; flex:0 0 auto; border-radius:var(--radius-full); overflow:hidden; display:grid; place-items:center; user-select:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-text) 8%, transparent);}
.screen .avatar-mono{width:100%; height:100%; display:grid; place-items:center; background:var(--color-text); color:var(--color-bg); font-weight:600; letter-spacing:0.01em;}
.screen .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
.screen .topbar{flex:0 0 auto; display:flex; align-items:center; gap:16px; height:60px; padding:0 24px; border-bottom:1px solid var(--color-border); background:color-mix(in srgb, var(--color-bg) 86%, transparent); position:sticky; top:0; z-index:10;}
.screen .topbar:has(> .topbar-inner){padding-inline:0;}
.screen .topbar-inner{width:100%; max-width:var(--content-reading); margin-inline:auto; padding-inline:24px; display:flex; align-items:center; gap:16px;}
.screen .topbar-title{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.006em;}
.screen .topbar-spacer{flex:1 1 auto;}
.screen .topbar-actions{display:flex; align-items:center; gap:8px;}
.screen .icon-btn{width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center; border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-muted); cursor:pointer; text-decoration:none;}
.screen .icon-btn:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .scroll{flex:1 1 auto; overflow:hidden;}
.screen .content{max-width:var(--content-reading); margin:0 auto; padding:28px 24px 40px; display:flex; flex-direction:column; gap:20px;}
.screen .status-pill{display:inline-flex; align-items:center; gap:7px; white-space:nowrap; font-size:var(--text-small); color:var(--color-text-muted); padding:5px 11px 5px 9px; border:1px solid var(--color-border); border-radius:var(--radius-full); background:var(--color-surface);}
.screen .status-pill .pill-dot{width:6px; height:6px; border-radius:var(--radius-full); background:var(--color-text-subtle);}
.screen .status-pill--success{color:var(--color-success); border-color:color-mix(in srgb, var(--color-success) 30%, var(--color-border));}
.screen .status-pill--success .pill-dot{background:var(--color-success);}

/* buttons */
.screen .btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; font-family:var(--font-sans); font-weight:500; font-size:var(--text-small); white-space:nowrap; cursor:pointer; user-select:none; border:1px solid transparent; border-radius:var(--radius-md); height:40px; padding-inline:16px; text-decoration:none;}
.screen .btn--sm{height:32px; padding-inline:11px; border-radius:var(--radius-sm);}
.screen .btn--primary{background:var(--color-primary); color:var(--color-primary-foreground);}
.screen .btn--secondary{background:var(--color-surface); color:var(--color-text); border-color:var(--color-border);}
.screen .btn--ghost{background:transparent; color:var(--color-text-muted);}

/* switch */
.screen .switch{position:relative; width:40px; height:23px; flex:0 0 auto; display:inline-block;}
.screen .switch .track{position:absolute; inset:0; border-radius:var(--radius-full); background:var(--color-ink-300); transition:background var(--duration-base) var(--ease-standard);}
.screen.pd-dark .switch .track{background:var(--color-ink-700);}
.screen .switch .knob{position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:var(--radius-full); background:#fff; box-shadow:var(--shadow-sm); transition:transform var(--duration-base) var(--ease-standard);}
.screen .switch.on .track{background:var(--color-primary);}
.screen .switch.on .knob{transform:translateX(17px); background:var(--color-primary-foreground);}
.screen .switch--lg{width:56px; height:30px;}
.screen .switch--lg .knob{width:24px; height:24px;}
.screen .switch--lg.on .knob{transform:translateX(26px);}

/* select field */
.screen .field{font-family:var(--font-sans); font-size:var(--text-small); color:var(--color-text); background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:0 32px 0 11px; height:36px; cursor:pointer; appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236f6e69' stroke-width='1.8' stroke-linecap='round'><path d='M6 9.5 12 15l6-5.5'/></svg>"); background-repeat:no-repeat; background-position:right 9px center;}
.screen.pd-dark .field{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%23898882' stroke-width='1.8' stroke-linecap='round'><path d='M6 9.5 12 15l6-5.5'/></svg>");}

/* toasts + overlay/dialog */
.screen .toast-host{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:10px; z-index:60;}
.screen .toast{display:flex; align-items:flex-start; gap:12px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:14px 16px; min-width:300px;}
.screen .toast .toast-mark{width:8px; height:8px; border-radius:var(--radius-full); margin-top:6px; flex:0 0 auto; background:var(--color-success);}
.screen .toast .toast-title{font-size:var(--text-small); font-weight:600;}
.screen .toast .toast-sub{font-size:var(--text-caption); color:var(--color-text-muted); margin-top:2px;}
.screen .toast .toast-undo{margin-left:8px; font-size:var(--text-small); font-weight:600; color:var(--color-accent); background:none; border:none; cursor:pointer; padding:2px 4px;}
.screen .overlay{position:absolute; inset:0; display:grid; place-items:center; padding:24px; background:color-mix(in srgb, var(--color-ink-950) 55%, transparent); backdrop-filter:blur(3px); z-index:30;}
.screen .dialog{width:100%; max-width:430px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-2xl); box-shadow:var(--shadow-lg); padding:24px;}
.screen .dialog-head{display:flex; align-items:flex-start; gap:12px;}
.screen .dialog-mark{flex:0 0 auto; width:38px; height:38px; border-radius:var(--radius-md); display:grid; place-items:center; background:color-mix(in srgb, var(--color-success) 13%, var(--color-surface)); border:1px solid color-mix(in srgb, var(--color-success) 26%, transparent); color:var(--color-success);}
.screen .dialog-title{font-size:var(--text-h3); font-weight:600; line-height:1.3;}
.screen .dialog-sub{font-size:var(--text-small); color:var(--color-text-muted); margin-top:4px; line-height:1.55; text-wrap:pretty;}
.screen .dialog-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:22px;}

/* ===================== AUTOPILOT.CSS (scoped) ===================== */
.screen .page-intro{display:flex; flex-direction:column; gap:4px;}
.screen .page-intro h1{font-size:var(--text-h1); font-weight:600; letter-spacing:-0.015em; margin:0;}
.screen .page-intro p{font-size:var(--text-body); color:var(--color-text-muted); margin:0; max-width:60ch;}

.screen .ap-master{display:flex; align-items:center; gap:18px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-xl); box-shadow:var(--shadow-sm); padding:22px 24px;}
.screen .ap-master--on{border-color:color-mix(in srgb, var(--color-success) 32%, var(--color-border));}
.screen .am-icon{width:46px; height:46px; flex:0 0 auto; display:grid; place-items:center; border-radius:var(--radius-lg); background:var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text-muted);}
.screen .ap-master--on .am-icon{background:color-mix(in srgb, var(--color-success) 14%, var(--color-surface)); border-color:color-mix(in srgb, var(--color-success) 28%, transparent); color:var(--color-success);}
.screen .am-text{flex:1 1 auto; min-width:0;}
.screen .am-title{font-size:var(--text-h2); font-weight:600; letter-spacing:-0.01em;}
.screen .am-state{display:inline-flex; align-items:center; gap:7px; font-size:var(--text-small); color:var(--color-text-muted); margin-top:4px;}
.screen .am-state .sdot{width:7px; height:7px; border-radius:var(--radius-full); background:var(--color-ink-400);}
.screen .ap-master--on .am-state .sdot{background:var(--color-success);}
.screen .ap-master--on .am-state{color:var(--color-success); font-weight:500;}

.screen .ap-reassure{display:flex; align-items:flex-start; gap:11px; font-size:var(--text-small); color:var(--color-text-muted); line-height:1.55; padding:13px 16px; background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md);}
.screen .ap-reassure .ar-ico{color:var(--color-text-subtle); flex:0 0 auto; margin-top:1px;}
.screen .ap-reassure b{color:var(--color-text); font-weight:600;}

.screen .ap-config{display:flex; flex-direction:column; gap:20px;}
.screen .ap-config--off{opacity:0.5; pointer-events:none;}

.screen .ap-section{background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); padding:20px 22px;}
.screen .ap-sec-head{display:flex; align-items:center; justify-content:space-between; gap:14px; margin-bottom:4px;}
.screen .ap-sec-title{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.006em;}
.screen .ap-sec-sub{font-size:var(--text-small); color:var(--color-text-subtle); margin-top:3px; text-wrap:pretty;}
.screen .ap-sec-body{margin-top:16px;}

.screen .obj-list{display:flex; flex-direction:column; gap:12px;}
.screen .obj-card{border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-surface-2); padding:14px 16px;}
.screen .obj-card--off{opacity:0.7;}
.screen .obj-head{display:flex; align-items:center; gap:12px;}
.screen .obj-name{flex:1 1 auto; min-width:0; font-size:var(--text-body); font-weight:600; height:34px; border:1px solid transparent; background:transparent; border-radius:var(--radius-sm); padding:0 8px; color:var(--color-text); display:flex; align-items:center;}
.screen .obj-name.is-focus{border-color:var(--color-accent); background:var(--color-surface); box-shadow:0 0 0 3px color-mix(in srgb, var(--color-accent) 18%, transparent);}
.screen .obj-remove{flex:0 0 auto; width:34px; height:34px;}
.screen .obj-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:14px;}
.screen .obj-field{display:flex; flex-direction:column; gap:6px; min-width:0;}
.screen .obj-field > label{font-size:var(--text-caption); font-weight:500; color:var(--color-text-muted);}
.screen .obj-field .field{height:36px; width:100%;}
.screen .obj-hint{font-size:var(--text-caption); color:var(--color-text-subtle); font-variant-numeric:tabular-nums;}
.screen .obj-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px; padding-top:13px; border-top:1px solid var(--color-border);}
.screen .obj-seed{display:flex; align-items:center; gap:9px; font-size:var(--text-small); color:var(--color-text-muted);}
.screen .obj-paused{font-size:var(--text-caption); color:var(--color-text-subtle);}

.screen .policy-list{display:flex; flex-direction:column;}
.screen .policy-list.is-off{opacity:0.5; pointer-events:none;}
.screen .policy-row{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 0; border-top:1px solid var(--color-border);}
.screen .policy-row:first-child{border-top:none; padding-top:4px;}
.screen .policy-row .pr-label{min-width:0;}
.screen .policy-row .pr-t{font-size:var(--text-small); font-weight:600;}
.screen .policy-row .pr-d{font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:2px; line-height:1.5;}
.screen .policy-row .pr-control{flex:0 0 auto;}
.screen .policy-row .pr-control .field{height:36px; min-width:168px;}

.screen .act-counters{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;}
.screen .counter{background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md); padding:13px 15px;}
.screen .counter .c-name{font-size:var(--text-caption); color:var(--color-text-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .counter .c-nums{display:flex; align-items:baseline; gap:12px; margin-top:8px;}
.screen .counter .c-num{font-size:var(--text-h3); font-weight:600; font-variant-numeric:tabular-nums;}
.screen .counter .c-num small{font-size:var(--text-caption); font-weight:500; color:var(--color-text-subtle); margin-left:4px;}

.screen .act-tabs{display:inline-flex; gap:3px; padding:3px; background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-md);}
.screen .act-tab{height:32px; padding:0 13px; font-size:var(--text-small); font-weight:500; color:var(--color-text-muted); background:transparent; border:1px solid transparent; border-radius:var(--radius-sm); cursor:pointer; white-space:nowrap;}
.screen .act-tab--active{background:var(--color-surface); color:var(--color-text); font-weight:600; border-color:var(--color-border); box-shadow:var(--shadow-sm);}
.screen .act-list{display:flex; flex-direction:column; gap:12px; margin-top:16px;}

.screen .autopost{border:1px solid var(--color-border); border-radius:var(--radius-md); padding:13px 15px; background:var(--color-surface);}
.screen .autopost-top{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
.screen .autopost-tag{display:inline-flex; align-items:center; gap:5px; font-size:var(--text-caption); font-weight:600; color:var(--color-text-muted); background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-full); padding:3px 9px;}
.screen .autopost-time{font-size:var(--text-caption); color:var(--color-text-subtle);}
.screen .autopost-time.spacer{margin-left:auto;}
.screen .autopost-text{font-size:var(--text-small); line-height:1.6; color:var(--color-text); text-wrap:pretty;}
.screen .autopost-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:10px; flex-wrap:wrap;}
.screen .autopost-stats{display:flex; gap:14px;}
.screen .autopost-stats .ms{display:inline-flex; align-items:center; gap:5px; font-size:var(--text-caption); color:var(--color-text-subtle);}
.screen .act-link{display:inline-flex; align-items:center; gap:5px; flex:0 0 auto; white-space:nowrap; font-size:var(--text-caption); font-weight:600; color:var(--color-accent); text-decoration:none;}

.screen .autoreply{border:1px solid var(--color-border); border-radius:var(--radius-md); padding:14px 15px; background:var(--color-surface);}
.screen .ar-comment{display:flex; gap:10px;}
.screen .ar-comment .arc-body{min-width:0;}
.screen .ar-comment .arc-who{font-size:var(--text-caption); font-weight:600; color:var(--color-text-muted);}
.screen .ar-comment .arc-who span{font-weight:400; color:var(--color-text-subtle);}
.screen .ar-comment .arc-text{font-size:var(--text-small); color:var(--color-text-muted); line-height:1.5; margin-top:2px;}
.screen .ar-reply{display:flex; gap:10px; margin-top:12px; padding-left:14px; position:relative;}
.screen .ar-reply::before{content:""; position:absolute; left:3px; top:2px; bottom:8px; width:2px; border-radius:2px; background:var(--color-border);}
.screen .ar-reply .arr-body{min-width:0;}
.screen .ar-reply .arr-who{display:flex; align-items:center; gap:7px; font-size:var(--text-caption); font-weight:600; margin-bottom:4px;}
.screen .ar-reply .arr-tag{font-weight:500; color:var(--color-accent); display:inline-flex; align-items:center; gap:4px;}
.screen .ar-reply .arr-text{font-size:var(--text-small); color:var(--color-text); line-height:1.55; text-wrap:pretty;}
.screen .ar-foot{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:10px;}

.screen .ap-empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:40px 24px; border:1px dashed var(--color-border); border-radius:var(--radius-md); background:color-mix(in srgb, var(--color-surface) 50%, transparent);}
.screen .ap-empty .ape-mark{width:46px; height:46px; display:grid; place-items:center; margin-bottom:14px; border-radius:var(--radius-md); background:var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text-subtle);}
.screen .ap-empty .ape-title{font-size:var(--text-h3); font-weight:600;}
.screen .ap-empty .ape-sub{font-size:var(--text-small); color:var(--color-text-muted); margin-top:6px; max-width:40ch; line-height:1.55;}
.screen .ap-empty .btn{margin-top:16px;}

/* skeleton */
.screen .skel-line{border-radius:var(--radius-md); background:linear-gradient(90deg, var(--color-surface-2) 0%, color-mix(in srgb, var(--color-text) 7%, var(--color-surface-2)) 50%, var(--color-surface-2) 100%); background-size:220% 100%; animation:shimmer 1.4s linear infinite;}
@keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}

/* mobile frame overrides */
.screen.mob .sidebar{flex-basis:72px; padding:16px 10px;}
.screen.mob .brand-name,.screen.mob .brand-sub,.screen.mob .nav-cap,
.screen.mob .nav-item .nav-label,.screen.mob .nav-item .nav-badge,
.screen.mob .account .who,.screen.mob .account .chev{display:none;}
.screen.mob .brand{justify-content:center; padding:8px 0 16px;}
.screen.mob .nav-item{justify-content:center; padding:10px;}
.screen.mob .account{justify-content:center;}
.screen.mob .content{padding:18px 14px 40px;}
.screen.mob .topbar-inner{padding-inline:14px;}
.screen.mob .obj-grid{grid-template-columns:1fr;}
.screen.mob .act-counters{grid-template-columns:1fr;}
.screen.mob .policy-row{flex-direction:column; align-items:flex-start; gap:10px;}
.screen.mob .policy-row .pr-control,.screen.mob .policy-row .pr-control .field{width:100%;}
.screen.mob .am-title{font-size:var(--text-h3);}
</style>
</head>
<body>
<div id="root"></div>
<script id="builder">
/* ===================== icons ===================== */
function ic(d,s){s=s||16;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+d+'</svg>';}
var ICONS={
 studio:'<path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/>',
 feed:'<rect x="4" y="5" width="16" height="4.5" rx="1.4"/><rect x="4" y="14.5" width="16" height="4.5" rx="1.4"/>',
 replies:'<path d="M5 6.5h14v8.5H10l-4 3.5v-3.5H5z"/>',
 at:'<circle cx="12" cy="12" r="3.4"/><path d="M15.4 12v1.6a2.4 2.4 0 0 0 4.1 1.4A8 8 0 1 0 15 19.4"/>',
 chart:'<path d="M5 19V5"/><path d="M5 19h14"/><rect x="8" y="11" width="2.6" height="5"/><rect x="13" y="7.5" width="2.6" height="8.5"/>',
 audit:'<rect x="6" y="4" width="12" height="16" rx="2"/><path d="M9 9h6M9 12.5h6M9 16h3.5"/>',
 study:'<path d="M5 5.5A1.5 1.5 0 0 1 6.5 4H18v13H6.5A1.5 1.5 0 0 0 5 18.5z"/><path d="M5 18.5A1.5 1.5 0 0 1 6.5 17H18v3H6.5A1.5 1.5 0 0 1 5 18.5z"/>',
 compass:'<circle cx="12" cy="12" r="8.2"/><path d="M15.4 8.6l-2 4.8-4.8 2 2-4.8z"/>',
 voice:'<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M6 11.5a6 6 0 0 0 12 0M12 17.5V20M9 20h6"/>',
 sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 autopilot:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',
 moon:'<path d="M20 14.5A8 8 0 1 1 9.5 4 6.3 6.3 0 0 0 20 14.5z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>',
 settings:'<circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l1.8-1.3-1.8-3.1-2.1.8a7 7 0 0 0-2-1.2l-.3-2.2H8.5l-.3 2.2a7 7 0 0 0-2 1.2l-2.1-.8L2.3 9.5l1.8 1.3A7 7 0 0 0 4 12a7 7 0 0 0 .1 1.2l-1.8 1.3 1.8 3.1 2.1-.8a7 7 0 0 0 2 1.2l.3 2.2h3.2l.3-2.2a7 7 0 0 0 2-1.2l2.1.8 1.8-3.1-1.8-1.3A7 7 0 0 0 19 12z"/>',
 nib:'<path d="M12 3.5 7 8.5l3 9 2 2 2-2 3-9z"/><circle cx="12" cy="11" r="1.2"/>',
 chevD:'<path d="M6 9.5 12 15l6-5.5"/>',
 check:'<path d="M5 12.5 10 17.5 19 7"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 trash:'<path d="M5 7h14M10 7V5h4v2M6.5 7l.7 12a1.6 1.6 0 0 0 1.6 1.5h6.4a1.6 1.6 0 0 0 1.6-1.5L18.5 7"/>',
 bolt:'<path d="M13 3 5 13h5l-1 8 8-10h-5z"/>',
 clock:'<circle cx="12" cy="12" r="8.2"/><path d="M12 7.5V12l3 2"/>',
 eye:'<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="2.6"/>',
 heart:'<path d="M12 20s-7-4.4-9.2-8.2A4.6 4.6 0 0 1 12 6a4.6 4.6 0 0 1 9.2 5.8C19 15.6 12 20 12 20Z"/>',
 bubble:'<path d="M5 6.5h14v8.5H10l-4 3.5v-3.5H5z"/>',
 external:'<path d="M8 6h10v10M18 6 7 17"/>'
};
function I(n,s){return ic(ICONS[n]||'',s);}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ===================== data (verbatim, em-dashes as punctuation stripped) ===================== */
/* Representative viewer timezone for this render: UTC+1, so the stored
   UTC hour shows as a clean local clock. 8:00 AM local -> 07:00 UTC (matches the brief). */
var TZ_HINT='UTC+1';
var TOPICS=['Writing craft','Revision & editing','Building in public','Consistency & habits','A question for my audience'];
var JITTER=['Exact (no spread)','\u00B1 5 min','\u00B1 15 min','\u00B1 30 min'];
var AUDIENCE=['Everyone','Followers only','People I follow','Mentions only'];
var CAPS=['10 / day','25 / day','50 / day','No cap'];
var OBJECTS=[
 {id:'o1',name:'Morning thought',local:'8:00 AM',utc:'07:00 UTC',jitter:'\u00B1 15 min',jitterHint:'Posts within \u00B115 min',topic:'Writing craft',on:true,seed:true},
 {id:'o2',name:'Midday craft note',local:'1:00 PM',utc:'12:00 UTC',jitter:'\u00B1 30 min',jitterHint:'Posts within \u00B130 min',topic:'Revision & editing',on:true,seed:false},
 {id:'o3',name:'Evening question',local:'7:30 PM',utc:'18:30 UTC',jitter:'Exact (no spread)',jitterHint:'Posts exactly at the time',topic:'A question for my audience',on:false,seed:true}
];
var POLICY={on:true,audience:'Followers only',cap:'25 / day'};
var COUNTERS=[
 {name:'Morning thought',posts:14,replies:38},
 {name:'Midday craft note',posts:11,replies:0},
 {name:'Evening question',posts:6,replies:22}
];
var POSTS=[
 {object:'Morning thought',at:'Today, 8:04 AM',text:'the draft you\u2019re avoiding is usually the one worth writing. open the doc, write one bad sentence, and let it pull you in.',views:'9.4K',likes:187,replies:14},
 {object:'Midday craft note',at:'Yesterday, 1:12 PM',text:'editing is just deciding, over and over, what you actually meant. the cuts are where the voice shows up.',views:'6.1K',likes:132,replies:9},
 {object:'Evening question',at:'Yesterday, 7:28 AM',text:'what\u2019s a piece of writing advice you had to unlearn? i\u2019ll start: \u201Cwrite every day\u201D nearly burned me out.',views:'12.8K',likes:264,replies:41}
];
var REPLIES=[
 {name:'Devon Pierce',handle:'@devon_makes',initials:'DP',at:'Today, 8:32 AM',onPost:'Morning thought',
  comment:'needed this exact reminder before opening my laptop today. how do you push past the first bad sentence?',
  reply:'honestly i just let it be bad on purpose, the second sentence is always braver once the first one\u2019s out of the way.'},
 {name:'Rivka Adler',handle:'@rivka.k',initials:'RA',at:'Yesterday, 9:06 AM',onPost:'Evening question',
  comment:'\u201Cwrite every day\u201D wrecked me too. what replaced it for you?',
  reply:'\u201Cwrite most weeks, finish what matters.\u201D consistency over streaks, missing a day stopped meaning anything.'},
 {name:'Ana Brandt',handle:'@ana.writes',initials:'AB',at:'Yesterday, 7:10 AM',onPost:'Evening question',
  comment:'the unlearning one is so real. mine was that every post has to teach something.',
  reply:'yes, sometimes a post just has to be true. not every line needs a lesson attached to it.'}
];

/* ===================== shell ===================== */
var NAV=[
 {cap:'Workspace',items:[['studio','Studio',4],['feed','My Feed',0],['replies','Replies',3],['at','Mentions',0]]},
 {cap:'Insight',items:[['chart','Stats',0],['audit','Audits',1],['study','Pattern study',0],['compass','Explore patterns',0]]},
 {cap:'Voice & automation',items:[['voice','Voice',0],['sliders','Style rules',0],['autopilot','Autopilot',0]]}
];
function sidebar(){
 var groups=NAV.map(function(g){
  var items=g.items.map(function(it){
   var icon=it[0],label=it[1],badge=it[2];
   var active=label==='Autopilot'?' nav-item--active':'';
   var cur=label==='Autopilot'?' aria-current="page"':'';
   var bdg=badge?'<span class="nav-badge">'+badge+'</span>':'';
   return '<a class="nav-item'+active+'"'+cur+'><span class="nav-ico">'+I(icon,16)+'</span><span class="nav-label">'+label+'</span>'+bdg+'</a>';
  }).join('');
  return '<div class="nav-cap">'+g.cap+'</div>'+items;
 }).join('');
 return '<aside class="sidebar"><div class="brand"><span class="brand-mark">'+I('nib',19)+'</span><div><div class="brand-name">Pennedly</div><div class="brand-sub">Drafting partner</div></div></div><nav class="nav">'+groups+'</nav><div class="sidebar-foot"><button class="account"><span class="avatar" style="width:32px;height:32px;"><span class="avatar-mono" style="font-size:13px;">ML</span></span><div class="who"><div class="nm">Mara Lin</div><div class="hd">@mara.lin</div></div><span class="chev">'+I('chevD',15)+'</span></button></div></aside>';
}
function topbar(on,dark){
 var pill=on?'<span class="status-pill status-pill--success"><span class="pill-dot"></span>Active</span>':'<span class="status-pill"><span class="pill-dot"></span>Off</span>';
 return '<header class="topbar"><div class="topbar-inner"><span class="topbar-title">Autopilot</span>'+pill+'<span class="topbar-spacer"></span><div class="topbar-actions"><button class="icon-btn" aria-label="Toggle theme">'+(dark?I('sun',17):I('moon',16))+'</button><a class="icon-btn" aria-label="Settings">'+I('settings',17)+'</a></div></div></header>';
}
function app(body,on,dark){
 return '<div class="app">'+sidebar()+'<div class="main">'+topbar(on,dark)+'<div class="scroll"><div class="content">'+pageIntro()+body+'</div></div></div></div>';
}
function pageIntro(){
 return '<div class="page-intro"><h1>Autopilot</h1><p>Let Pennedly post and reply on a schedule, entirely opt-in. It\u2019s off by default, and you stay in control.</p></div>';
}

/* ===================== pieces ===================== */
function sw(on,big){return '<span class="switch'+(big?' switch--lg':'')+(on?' on':'')+'"><span class="track"></span><span class="knob"></span></span>';}
function selectField(value,options){
 var opts=options.map(function(o){return '<option'+(o===value?' selected':'')+'>'+esc(o)+'</option>';}).join('');
 return '<select class="field">'+opts+'</select>';
}
function master(on){
 var state=on?'On \u00B7 posting and replying on your schedule':'Off \u00B7 you approve everything yourself';
 return '<div class="ap-master'+(on?' ap-master--on':'')+'"><span class="am-icon">'+I('bolt',24)+'</span><div class="am-text"><div class="am-title">Autopilot</div><div class="am-state"><span class="sdot"></span>'+state+'</div></div>'+sw(on,true)+'</div>';
}
function reassure(){
 return '<div class="ap-reassure">'+I('check',16)+'<div><b>Autopilot is off, nothing posts or replies without you.</b> Set up your schedules and reply policy below, then turn it on when you\u2019re ready. You can pause it again anytime.</div></div>';
}
function objectCard(o,opts){
 opts=opts||{};
 var nameFocus=opts.focusName?' is-focus':'';
 return '<div class="obj-card'+(o.on?'':' obj-card--off')+'"><div class="obj-head"><span class="obj-name'+nameFocus+'">'+esc(o.name)+'</span>'+sw(o.on)+'<button class="icon-btn obj-remove" aria-label="Remove schedule">'+I('trash',16)+'</button></div>'
  +'<div class="obj-grid">'
   +'<div class="obj-field"><label>Post time</label>'+selectField(o.local,[o.local])+'<span class="obj-hint">'+TZ_HINT+' \u00B7 sends '+esc(o.utc)+'</span></div>'
   +'<div class="obj-field"><label>Random spread</label>'+selectField(o.jitter,JITTER)+'<span class="obj-hint">'+esc(o.jitterHint)+'</span></div>'
   +'<div class="obj-field"><label>Topic</label>'+selectField(o.topic,TOPICS)+'</div>'
  +'</div>'
  +'<div class="obj-foot"><label class="obj-seed">'+sw(o.seed)+' New posts from this schedule start with auto-reply on</label>'+(o.on?'':'<span class="obj-paused">Paused</span>')+'</div>'
 +'</div>';
}
function scheduleSection(objs,opts){
 opts=opts||{};
 var body;
 if(!objs.length){
  body='<div class="ap-empty"><div class="ape-mark">'+I('bolt',22)+'</div><div class="ape-title">No schedules yet</div><div class="ape-sub">Add a schedule and Pennedly will draft and post on a rhythm, always in your voice, always visible in your feed.</div><button class="btn btn--secondary">'+I('plus',16)+' Add a schedule</button></div>';
  if(opts.addForm){
   body+='<div style="margin-top:12px">'+objectCard({id:'new',name:'New schedule',local:'9:00 AM',utc:'08:00 UTC',jitter:'\u00B1 15 min',jitterHint:'Posts within \u00B115 min',topic:'Writing craft',on:false,seed:false},{focusName:true})+'</div>';
  }
 } else {
  body='<div class="obj-list">'+objs.map(function(o,i){return objectCard(o,{focusName:opts.focusFirst&&i===0});}).join('')+'</div>';
 }
 var add=objs.length?'<button class="btn btn--secondary btn--sm">'+I('plus',15)+' Add</button>':'';
 return '<div class="ap-section"><div class="ap-sec-head"><div><div class="ap-sec-title">Scheduled posts</div><div class="ap-sec-sub">Each schedule drafts a post in your voice and publishes it around the set time, shown in your local time ('+TZ_HINT+').</div></div>'+add+'</div><div class="ap-sec-body">'+body+'</div></div>';
}
function policySection(p){
 var listOff=p.on?'':' is-off';
 return '<div class="ap-section"><div class="ap-sec-head"><div><div class="ap-sec-title">Auto-reply policy</div><div class="ap-sec-sub">Account-wide. When on, replies are drafted in your voice and sent automatically under these limits.</div></div>'+sw(p.on)+'</div><div class="ap-sec-body"><div class="policy-list'+listOff+'">'
  +'<div class="policy-row"><div class="pr-label"><div class="pr-t">Who it replies to</div><div class="pr-d">The audience whose comments can get an automatic reply.</div></div><div class="pr-control">'+selectField(p.audience,AUDIENCE)+'</div></div>'
  +'<div class="policy-row"><div class="pr-label"><div class="pr-t">Replies per day</div><div class="pr-d">A safety limit on how many replies autopilot sends each day.</div></div><div class="pr-control">'+selectField(p.cap,CAPS)+'</div></div>'
 +'</div></div></div>';
}
function counters(list){
 return '<div class="act-counters">'+list.map(function(c){return '<div class="counter"><div class="c-name">'+esc(c.name)+'</div><div class="c-nums"><span class="c-num">'+c.posts+'<small>posts</small></span><span class="c-num">'+c.replies+'<small>replies</small></span></div></div>';}).join('')+'</div>';
}
function autoPost(p){
 return '<div class="autopost"><div class="autopost-top"><span class="autopost-tag">'+I('bolt',12)+esc(p.object)+'</span><span class="autopost-time spacer">'+esc(p.at)+'</span></div><div class="autopost-text">'+esc(p.text)+'</div><div class="autopost-foot"><div class="autopost-stats"><span class="ms">'+I('eye',13)+esc(p.views)+'</span><span class="ms">'+I('heart',13)+p.likes+'</span><span class="ms">'+I('bubble',13)+p.replies+'</span></div><a class="act-link">View post'+I('external',13)+'</a></div></div>';
}
function autoReply(r){
 return '<div class="autoreply"><div class="ar-comment"><span class="avatar" style="width:28px;height:28px;"><span class="avatar-mono" style="font-size:11px;">'+esc(r.initials)+'</span></span><div class="arc-body"><div class="arc-who">'+esc(r.name)+' <span>'+esc(r.handle)+'</span></div><div class="arc-text">'+esc(r.comment)+'</div></div></div><div class="ar-reply"><div class="arr-body"><div class="arr-who">You <span class="arr-tag">'+I('bolt',11)+'auto-replied</span></div><div class="arr-text">'+esc(r.reply)+'</div></div></div><div class="ar-foot"><span>'+esc(r.at)+' \u00B7 on a comment to your \u201C'+esc(r.onPost)+'\u201D post</span><a class="act-link">View thread'+I('external',13)+'</a></div></div>';
}
function activitySection(tab){
 tab=tab||'posts';
 var tabs='<div class="act-tabs"><button class="act-tab'+(tab==='posts'?' act-tab--active':'')+'">Posts</button><button class="act-tab'+(tab==='replies'?' act-tab--active':'')+'">Replies</button></div>';
 var list=tab==='posts'?POSTS.map(autoPost).join(''):REPLIES.map(autoReply).join('');
 return '<div class="ap-section"><div class="ap-sec-head"><div><div class="ap-sec-title">Activity</div><div class="ap-sec-sub">Everything autopilot has done, read-only.</div></div>'+tabs+'</div><div class="ap-sec-body">'+counters(COUNTERS)+'<div class="act-list">'+list+'</div></div></div>';
}
function skeleton(){
 var secs='';
 for(var i=0;i<2;i++){secs+='<div class="ap-section" aria-hidden="true"><div class="skel-line" style="width:160px;height:16px;"></div><div class="skel-line" style="width:100%;height:80px;margin-top:16px;border-radius:10px;"></div></div>';}
 return '<div class="ap-master" aria-hidden="true"><div class="skel-line" style="width:46px;height:46px;border-radius:12px;"></div><div style="flex:1"><div class="skel-line" style="width:120px;height:18px;"></div><div class="skel-line" style="width:220px;height:11px;margin-top:8px;"></div></div><div class="skel-line" style="width:56px;height:30px;border-radius:99px;"></div></div>'+secs;
}
function toast(title,sub,undo){
 return '<div class="toast-host"><div class="toast"><span class="toast-mark"></span><div class="toast-body"><div class="toast-title">'+esc(title)+'</div>'+(sub?'<div class="toast-sub">'+esc(sub)+'</div>':'')+'</div>'+(undo?'<button class="toast-undo">Undo</button>':'')+'</div></div>';
}
function dialogTurnOn(){
 return '<div class="overlay"><div class="dialog" role="dialog"><div class="dialog-head"><span class="dialog-mark">'+I('bolt',18)+'</span><div><div class="dialog-title">Turn on Autopilot?</div><div class="dialog-sub">Pennedly will publish your enabled schedules and send replies under your policy, automatically. Every post still appears in your feed, and you can pause anytime.</div></div></div><div class="dialog-actions"><button class="btn btn--ghost">Cancel</button><button class="btn btn--primary">'+I('bolt',15)+' Turn on autopilot</button></div></div></div>';
}

/* ===================== bodies ===================== */
function bodyOn(){
 return master(true)+'<div class="ap-config">'+scheduleSection(OBJECTS)+policySection(POLICY)+activitySection('posts')+'</div>';
}
function bodyOff(){
 return master(false)+reassure()+'<div class="ap-config">'+scheduleSection(OBJECTS)+policySection(POLICY)+activitySection('posts')+'</div>';
}
function bodyEdit(){
 return master(true)+'<div class="ap-config">'+scheduleSection(OBJECTS,{focusFirst:true})+'</div>';
}
function bodyEmpty(){
 return master(true)+'<div class="ap-config">'+scheduleSection([],{addForm:false})+policySection(POLICY)+activityEmptySection()+'</div>';
}
function bodyEmptyAdd(){
 return master(true)+'<div class="ap-config">'+scheduleSection([],{addForm:true})+'</div>';
}
function bodyPolicyOff(){
 return master(true)+'<div class="ap-config">'+policySection({on:false,audience:'Followers only',cap:'25 / day'})+'</div>';
}
function bodyReplies(){
 return master(true)+'<div class="ap-config">'+activitySection('replies')+'</div>';
}
function activityEmptySection(){
 return '<div class="ap-section"><div class="ap-sec-head"><div><div class="ap-sec-title">Activity</div><div class="ap-sec-sub">Everything autopilot has done, read-only.</div></div></div><div class="ap-sec-body"><div class="ap-empty"><div class="ape-mark">'+I('clock',22)+'</div><div class="ape-title">No activity yet</div><div class="ape-sub">Once autopilot runs, the posts it publishes and the replies it sends will appear here for you to review.</div></div></div></div>';
}
function bodySkeleton(){ return skeleton(); }

/* ===================== frames ===================== */
function frame(device,theme,label,body,on,extra){
 var dark=theme==='dark';
 var screen='<div class="screen '+device+' pd-'+theme+'">'+app(body,on,dark)+(extra||'')+'</div>';
 return '<figure class="vp"><figcaption><span class="tg tg--'+(device==='web'?'web':'mob')+'">'+(device==='web'?'Web · 1060':'Mobile · 392')+'</span><span class="tg tg--'+theme+'">'+(dark?'Dark':'Light')+'</span><span class="lbl">'+label+'</span></figcaption>'+screen+'</figure>';
}
function sectionHead(num,title,desc,notes,sub){
 var noteList=(notes||[]).map(function(n){return '<li>'+n+'</li>';}).join('');
 return '<section class="state-sec'+(sub?'':' divide')+'"><div class="sec-num">'+num+'</div><h2 class="sec-title'+(sub?' sub':'')+'">'+title+'</h2><p class="sec-desc">'+desc+'</p>'+(noteList?'<ul class="sec-notes">'+noteList+'</ul>':'')+'</section>';
}
function noteCard(t){return '<div class="note-card"><div class="nc">'+t+'</div></div>';}
function gallery(f){return '<div class="gallery">'+f+'</div>';}

/* ===================== build ===================== */
var H='';
H+='<header class="doc-head">'
 +'<p class="doc-kicker">Pennedly · State spec · build contract</p>'
 +'<h1 class="doc-title">Autopilot · scheduled posting + auto-reply, every state rendered</h1>'
 +'<p class="doc-lede">Full-fidelity render of <b>Autopilot</b> (<code>/app/autopilot</code>), where the user lets Pennedly post and reply on a schedule, in their voice. It is <b>off by default</b> and assembled from four parts: a <b>master switch</b>, the <b>schedule objects</b>, the account <b>auto-reply policy</b>, and a read-only <b>activity log</b>. Every frame uses the real PennedlyDesign tokens, the shared shell, and the real copy from <code>autopilot-data.jsx</code> (Mara Lin). Reading width <b>720px</b>. Each state is labeled for <b>web + mobile</b> in <b>light + dark</b>. Em-dashes used as punctuation are stripped from copy.</p>'
 +'<div class="doc-meta"><span class="m">route /app/autopilot</span><span class="m">sidebar: Autopilot</span><span class="m">width 720</span><span class="m">off by default</span><span class="m">UTC-stored · local-shown time</span><span class="m">tweaks: dark · state</span></div>'
 +'</header>'
 +'<div class="legend"><span class="lk"><span class="dot" style="background:#2c7350;"></span>active / on</span><span class="lk"><span class="dot" style="background:#171717;"></span>switch on (ink)</span><span class="lk"><span class="dot" style="background:#c8c7c3;"></span>off / paused</span><span class="lk"><span class="dot" style="background:#2f4cc4;"></span>accent / link / auto-reply</span></div>';

H+=noteCard('<b>Two honest notes from the real code:</b> (1) The schedule object is <b>always its editable form</b>, the name is an inline input and time / spread / topic are inline selects, there is no separate collapsed read row to expand. \u201CEdit mode\u201D is simply this card (State 3). (2) <b>Time is stored in UTC, shown in the viewer\u2019s local timezone</b> with a <code>UTC\u00B1N \u00B7 sends HH:MM UTC</code> hint. This render uses a representative <b>UTC+1</b> viewer, so <code>8:00 AM</code> shows <code>07:00 UTC</code> (exactly the brief\u2019s example); a viewer elsewhere would see the same schedule at their own local clock.');

// STATE 1 — master ON populated
H+=sectionHead('State 1','Master ON, fully populated',
 'The live screen. The master card is on (success border + bolt), the three schedule objects show their local times with the UTC hint, the auto-reply policy card is on with Followers only / 25 per day, and the activity log shows the per-object counters, then the recent auto-posts (text + views/likes/replies + a View post link out). Topbar pill is <code>Active</code> (success).',
 ['Schedule seed: Morning thought 8:00 AM (15:00 UTC) \u00B115 Writing craft, on; Midday craft note 1:00 PM (20:00 UTC) \u00B130 Revision &amp; editing, on; Evening question 7:30 PM (02:30 UTC) Exact, Paused.',
  'Counters: Morning thought 14 posts / 38 replies, Midday craft note 11 / 0, Evening question 6 / 22.',
  'Activity has a Posts / Replies tab pair; State 1 shows Posts, the extras below show the Replies tab.']);
H+=gallery(
 frame('web','light','Master ON · populated',bodyOn(),true)
 +frame('web','dark','Master ON · populated',bodyOn(),true)
 +frame('mob','light','Master ON · mobile',bodyOn(),true)
 +frame('mob','dark','Master ON · mobile',bodyOn(),true)
);

// STATE 2 — master OFF dormant
H+=sectionHead('State 2','Master OFF, with reassurance banner',
 'The default. The master card is off (neutral), the reassurance banner explains nothing posts without you, and crucially the rest of the screen stays <b>fully visible and editable</b> underneath: you set up your schedules and reply policy while off, then turn it on when ready. The turn-on affordance is the master switch itself, flipping it on opens a confirm dialog (extras below). Topbar pill is <code>Off</code>.',
 ['Off is the safe, deliberate default; only enabling the master is gated behind a confirm, turning it off is immediate.',
  'The schedule and policy cards are NOT dimmed when off, the real app keeps them interactive so you can build your setup before going live.']);
H+=gallery(
 frame('web','light','Master OFF + reassurance',bodyOff(),false)
 +frame('web','dark','Master OFF + reassurance',bodyOff(),false)
 +frame('mob','light','Master OFF · mobile',bodyOff(),false)
);

// STATE 3 — object edit
H+=sectionHead('State 3','Schedule object in edit',
 'A single schedule object close up. Because the card is always editable, this is the object form itself: the name input (focused here), the enable switch, delete, then the three-up grid, the local time picker (half-hour slots) with its <code>UTC+1 \u00B7 sends 07:00 UTC</code> hint, the random-spread selector (Exact, \u00B15, \u00B115, \u00B130), and the topic selector from the account\u2019s topic list, plus the seed toggle for new posts.',
 ['The time picker lists every half hour across the day in local time; the stored value is UTC.',
  'There is no separate save/cancel, edits persist per field inline (the card is the form). Delete is undoable via toast (extras).']);
H+=gallery(
 frame('web','light','Object edit · name focused',bodyEdit(),true)
 +frame('web','dark','Object edit · name focused',bodyEdit(),true)
 +frame('mob','light','Object edit · mobile (fields stack)',bodyEdit(),true)
);

// STATE 4 — empty schedule
H+=sectionHead('State 4','Empty schedule and empty activity',
 'Master on but nothing set up yet. The Scheduled posts section shows a calm empty card (bolt mark, \u201CNo schedules yet,\u201D Add a schedule), and the Activity section shows its own empty state (clock mark, No activity yet). The third frame shows the add form appended and focused, ready to name the first schedule.',
 ['Two independent empty states: the schedule list (No schedules yet) and the activity log (No activity yet).',
  'Adding appends a paused New schedule at 9:00 AM (08:00 UTC), \u00B115, Writing craft, off, with a confirming toast.']);
H+=gallery(
 frame('web','light','Empty schedule',bodyEmpty(),true)
 +frame('web','dark','Empty schedule',bodyEmpty(),true)
 +frame('web','light','Empty + add form focused',bodyEmptyAdd(),true)
 +frame('mob','light','Empty · mobile',bodyEmpty(),true)
);

// STATE 5 — policy off
H+=sectionHead('State 5','Auto-reply policy off',
 'The account auto-reply policy card with its master switch off, so the audience and daily-cap controls go quiet (50% opacity, not interactive). This is separate from the per-schedule on/off and from the master Autopilot switch.',
 ['Audience options: Everyone, Followers only, People I follow, Mentions only. Cap options: 10 / day, 25 / day, 50 / day, No cap.',
  'The per-schedule \u201Cseed\u201D toggle only sets the initial auto-reply state of new posts; this account policy is what the worker actually honors.']);
H+=gallery(
 frame('web','light','Policy off · controls quiet',bodyPolicyOff(),true)
 +frame('web','dark','Policy off · controls quiet',bodyPolicyOff(),true)
);

// STATE 6 — loading + extras
H+=sectionHead('State 6','Loading skeleton',
 'The boot skeleton (about 850ms, or the state=Loading tweak): a master-card placeholder and two section placeholders with shimmer lines, shown before the real data resolves.',
 null);
H+=gallery(
 frame('web','light','Loading skeleton',bodySkeleton(),false)
 +frame('web','dark','Loading skeleton',bodySkeleton(),false)
);

H+=sectionHead('Extras','Activity · Replies tab, turn-on confirm, delete Undo',
 'Supporting states referenced above. The Replies tab of the activity log (commenter avatar + their comment, the reply Autopilot sent in your voice, which post it was on, and a View thread link). The confirm dialog that gates turning the master on. And the undoable delete toast.',
 null,true);
H+=gallery(
 frame('web','light','Activity · Replies tab',bodyReplies(),true)
 +frame('web','dark','Activity · Replies tab',bodyReplies(),true)
 +frame('web','light','Turn-on confirm dialog',bodyOff(),false,dialogTurnOn())
 +frame('web','light','Delete schedule · Undo toast',bodyEdit(),true,toast('Schedule removed','',true))
);

document.getElementById('root').innerHTML=H;
</script>
</body>
</html>
