<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings + Account control — State Spec · Pennedly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/* ============================ DOC CHROME ============================ */
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0; background:#e7e4df; color:#1c1b19; font-family:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased;}
.doc-head{max-width:1200px; margin:0 auto; padding:46px 40px 8px;}
.doc-kicker{font-family:"Geist Mono",monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#2f4cc4; margin:0 0 12px;}
.doc-title{font-size:38px; line-height:1.05; letter-spacing:-0.025em; font-weight:600; margin:0 0 14px;}
.doc-lede{font-size:16px; line-height:1.6; color:#56544f; max-width:80ch; margin:0 0 8px;}
.doc-lede b{color:#1c1b19; font-weight:600;}
.doc-meta{display:flex; flex-wrap:wrap; gap:7px; margin:22px 0 4px;}
.doc-meta .m{font-family:"Geist Mono",monospace; font-size:11.5px; padding:4px 10px; border-radius:9999px; background:#fff; border:1px solid #d4d1ca; color:#56544f;}
.legend{max-width:1200px; margin:18px auto 0; padding:0 40px; display:flex; flex-wrap:wrap; gap:18px; font-size:12.5px; color:#56544f;}
.legend .lk{display:inline-flex; align-items:center; gap:7px;}
.legend .dot{width:10px; height:10px; border-radius:3px; border:1px solid rgba(0,0,0,.15);}

.state-sec{max-width:1200px; margin:8px auto 0; padding:42px 40px 8px;}
.state-sec + .state-sec, .state-sec.divide{border-top:1px solid #d4d1ca; margin-top:22px;}
.part-band{max-width:1200px; margin:28px auto 0; padding:0 40px;}
.part-band .pb{display:flex; align-items:center; gap:12px; padding:14px 18px; background:#1c1b19; color:#f3f1ec; border-radius:12px;}
.part-band .pb .pn{font-family:"Geist Mono",monospace; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; color:#bdb8ad;}
.part-band .pb .pt{font-size:17px; font-weight:600;}
.sec-num{font-family:"Geist Mono",monospace; font-size:13px; color:#2f4cc4; font-weight:500;}
.sec-title{font-size:25px; line-height:1.2; letter-spacing:-0.015em; font-weight:600; margin:6px 0 8px;}
.sec-title.sub{font-size:19px;}
.sec-desc{font-size:14.5px; line-height:1.6; color:#56544f; max-width:82ch; margin:0 0 6px;}
.sec-desc code{font-family:"Geist Mono",monospace; font-size:0.86em; background:#dedbd4; padding:1px 5px; border-radius:5px;}
.sec-notes{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:5px;}
.sec-notes li{position:relative; padding-left:20px; font-size:13px; line-height:1.55; color:#56544f; max-width:86ch;}
.sec-notes li::before{content:"›"; position:absolute; left:4px; top:0; color:#2f4cc4; font-weight:700;}
.sec-notes li b{color:#1c1b19; font-weight:600;}
.sec-notes code{font-family:"Geist Mono",monospace; font-size:0.85em; background:#dedbd4; padding:1px 5px; border-radius:5px;}
.note-card{max-width:1200px; margin:12px auto 0; padding:0 40px;}
.note-card .nc{border:1px solid #d8c9a6; background:#f7f1e1; border-radius:12px; padding:13px 16px; font-size:13.5px; line-height:1.55; color:#5b5232;}
.note-card .nc b{color:#3f3a22;}
.note-card .nc code{font-family:"Geist Mono",monospace; font-size:0.86em; background:#ece3c8; padding:1px 5px; border-radius:5px;}
.note-card .nc ul{margin:8px 0 0; padding-left:18px;}
.note-card .nc li{margin:3px 0;}

.gallery{max-width:1200px; margin:0 auto; padding:22px 40px 12px; display:flex; flex-wrap:wrap; gap:32px 34px; align-items:flex-start;}
.vp{margin:0;}
.vp figcaption{display:flex; align-items:center; gap:9px; margin:0 0 10px; font-size:12px; color:#56544f; flex-wrap:wrap;}
.vp figcaption .tg{font-family:"Geist Mono",monospace; font-size:10.5px; letter-spacing:0.03em; text-transform:uppercase; padding:3px 8px; border-radius:6px; border:1px solid #d4d1ca; background:#fff;}
.vp figcaption .tg--web{color:#1c1b19;}
.vp figcaption .tg--mob{color:#2f4cc4; border-color:#c2c8ef; background:#eef0fb;}
.vp figcaption .tg--rail{color:#1f7a52; border-color:#bfe0cf; background:#e9f5ee;}
.vp figcaption .tg--light{color:#7b6a2a; border-color:#e3dcc4; background:#f7f2e4;}
.vp figcaption .tg--dark{color:#cfcfe6; border-color:#3a3a52; background:#26263a;}
.vp figcaption .lbl{font-weight:500; color:#1c1b19;}

.screen{border-radius:16px; overflow:hidden; position:relative; box-shadow:0 18px 50px -20px rgba(20,18,15,.5), 0 4px 12px -6px rgba(20,18,15,.25);}
.screen.web{width:1040px;}
.screen.mob{width:392px; border-radius:30px; box-shadow:0 18px 50px -18px rgba(20,18,15,.55), 0 0 0 9px #15140f, 0 0 0 10px #2a2925;}
.screen.rail{width:286px;}
@media (max-width:1140px){ .screen.web{width:100%; max-width:920px;} }
.screen, .screen *{box-sizing:border-box;}

/* =============== PENNEDLY TOKENS (scoped per .screen) =============== */
.screen{
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --color-ink-50:#f9f8f6; --color-ink-100:#ededed; --color-ink-200:#ddddda; --color-ink-300:#c8c7c3;
  --color-ink-400:#a2a19c; --color-ink-500:#7b7a74; --color-ink-600:#565550; --color-ink-700:#3c3b37;
  --color-ink-800:#262521; --color-ink-900:#171717; --color-ink-950:#0a0a0a;
  --color-bg:#efedea; --color-surface:#ffffff; --color-surface-2:#f6f5f2; --color-border:#dcd9d2;
  --color-text:#171717; --color-text-muted:#565550; --color-text-subtle:#6f6e69;
  --color-primary:#171717; --color-primary-foreground:#ededed;
  --color-accent:#2f4cc4; --color-accent-foreground:#ffffff;
  --color-success:#2c7350; --color-success-foreground:#ffffff;
  --color-warning:#8a5b16; --color-warning-foreground:#ffffff;
  --color-danger:#b23b30; --color-danger-foreground:#ffffff;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-2xl:28px; --radius-full:9999px;
  --shadow-sm:0 1px 2px 0 rgb(23 23 23 / 0.06);
  --shadow-md:0 4px 12px -2px rgb(23 23 23 / 0.08), 0 2px 6px -3px rgb(23 23 23 / 0.06);
  --shadow-lg:0 16px 40px -12px rgb(23 23 23 / 0.16), 0 6px 14px -8px rgb(23 23 23 / 0.08);
  --text-display:3rem; --text-h1:2rem; --text-h2:1.5rem; --text-h3:1.1875rem;
  --text-body:0.9375rem; --text-small:0.8125rem; --text-caption:0.75rem;
  --content-reading:720px; --content-wide:960px;
  --ease-standard:cubic-bezier(0.2,0.7,0.3,1); --ease-entrance:cubic-bezier(0.16,1,0.3,1);
  --duration-fast:120ms; --duration-base:180ms; --duration-slow:240ms;
  font-family:var(--font-sans);
}
.screen.pd-dark{
  --color-bg:#0a0a0a; --color-surface:#171717; --color-surface-2:#201f1d; --color-border:#2b2a27;
  --color-text:#ededed; --color-text-muted:#a2a19c; --color-text-subtle:#898882;
  --color-primary:#ededed; --color-primary-foreground:#171717;
  --color-accent:#9aacff; --color-accent-foreground:#0a0a0a;
  --color-success:#5fbf8d; --color-success-foreground:#0a0a0a;
  --color-warning:#d8a754; --color-warning-foreground:#0a0a0a;
  --color-danger:#ef8a80; --color-danger-foreground:#0a0a0a;
  --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.5);
  --shadow-md:0 6px 16px -4px rgb(0 0 0 / 0.6);
  --shadow-lg:0 20px 48px -16px rgb(0 0 0 / 0.7);
}

/* ===================== SHELL ===================== */
.screen .app{display:flex; height:100%; background:var(--color-bg); color:var(--color-text); font-family:var(--font-sans); line-height:1.5;}
.screen .sidebar{flex:0 0 248px; display:flex; flex-direction:column; gap:4px; padding:16px 14px; border-right:1px solid var(--color-border); background:var(--color-bg);}
.screen .brand{display:flex; align-items:center; gap:11px; padding:8px 8px 16px;}
.screen .brand-mark{width:34px; height:34px; flex:0 0 auto; border-radius:var(--radius-md); box-shadow:var(--shadow-sm); display:grid; place-items:center; background:var(--color-text); color:var(--color-bg);}
.screen .brand-name{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.01em; line-height:1;}
.screen .brand-sub{font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:3px;}
.screen .nav{display:flex; flex-direction:column; gap:2px;}
.screen .nav-cap{font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle); padding:14px 12px 6px;}
.screen .nav-item{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:var(--radius-md); font-size:var(--text-small); font-weight:500; color:var(--color-text-muted); border:1px solid transparent; position:relative; cursor:pointer; text-decoration:none;}
.screen .nav-item:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .nav-item--active{background:var(--color-surface-2); color:var(--color-text); font-weight:600;}
.screen .nav-item .nav-ico{width:16px; height:16px; flex:0 0 auto; opacity:0.85;}
.screen .nav-item .nav-label{white-space:nowrap;}
.screen .nav-item .nav-badge{margin-left:auto; font-size:var(--text-caption); font-weight:600; color:var(--color-text-subtle); background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-full); min-width:20px; height:18px; padding:0 6px; display:inline-flex; align-items:center; justify-content:center;}
.screen .nav-item--active .nav-badge{color:var(--color-text);}
.screen .sidebar-foot{margin-top:auto; padding-top:10px; position:relative;}
.screen .main{flex:1 1 auto; min-width:0; display:flex; flex-direction:column;}
.screen .topbar{flex:0 0 auto; display:flex; align-items:center; gap:16px; height:60px; padding:0 24px; border-bottom:1px solid var(--color-border); background:color-mix(in srgb, var(--color-bg) 86%, transparent); position:sticky; top:0; z-index:10;}
.screen .topbar:has(> .topbar-inner){padding-inline:0;}
.screen .topbar-inner{width:100%; max-width:var(--content-reading); margin-inline:auto; padding-inline:24px; display:flex; align-items:center; gap:16px;}
.screen .topbar-title{font-size:var(--text-h3); font-weight:600; letter-spacing:-0.006em;}
.screen .topbar-spacer{flex:1 1 auto;}
.screen .topbar-actions{display:flex; align-items:center; gap:8px;}
.screen .icon-btn{width:36px; height:36px; flex:0 0 auto; display:grid; place-items:center; border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-surface); color:var(--color-text-muted); cursor:pointer; text-decoration:none;}
.screen .icon-btn:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .scroll{flex:1 1 auto; overflow:hidden;}
.screen .content{max-width:var(--content-reading); margin:0 auto; padding:28px 24px 40px; display:flex; flex-direction:column; gap:16px;}

/* avatar */
.screen .avatar{position:relative; flex:0 0 auto; border-radius:var(--radius-full); overflow:hidden; background:var(--color-surface-2); display:grid; place-items:center; user-select:none; box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--color-text) 8%, transparent);}
.screen .avatar-mono{width:100%; height:100%; display:grid; place-items:center; background:var(--color-text); color:var(--color-bg); font-weight:600; letter-spacing:0.01em;}

/* buttons */
.screen .btn{display:inline-flex; align-items:center; justify-content:center; gap:7px; font-family:var(--font-sans); font-weight:500; font-size:var(--text-small); white-space:nowrap; cursor:pointer; user-select:none; border:1px solid transparent; border-radius:var(--radius-md); height:40px; padding-inline:16px; text-decoration:none;}
.screen .btn--sm{height:32px; padding-inline:11px; border-radius:var(--radius-sm); font-size:var(--text-caption);}
.screen .btn--primary{background:var(--color-primary); color:var(--color-primary-foreground);}
.screen .btn--secondary{background:var(--color-surface); color:var(--color-text); border-color:var(--color-border);}
.screen .btn--secondary:hover{background:var(--color-surface-2);}
.screen .btn--ghost{background:transparent; color:var(--color-text-muted);}
.screen .btn--ghost:hover{background:var(--color-surface-2); color:var(--color-text);}
.screen .btn--danger{background:var(--color-danger); color:var(--color-danger-foreground);}

/* toasts */
.screen .toast-host{position:absolute; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:10px; z-index:60;}
.screen .toast{display:flex; align-items:flex-start; gap:12px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:14px 16px; min-width:300px;}
.screen .toast .toast-mark{width:8px; height:8px; border-radius:var(--radius-full); margin-top:6px; flex:0 0 auto; background:var(--color-success);}
.screen .toast .toast-title{font-size:var(--text-small); font-weight:600;}
.screen .toast .toast-sub{font-size:var(--text-caption); color:var(--color-text-muted); margin-top:2px;}
.screen .toast .toast-undo{margin-left:8px; font-size:var(--text-small); font-weight:600; color:var(--color-accent); background:none; border:none; cursor:pointer; padding:2px 4px;}

/* ===================== SETTINGS.CSS (scoped) ===================== */
.screen .intro{display:flex; flex-direction:column; margin-bottom:2px;}
.screen .intro-eyebrow{font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle);}
.screen .intro-title{font-size:var(--text-h1); font-weight:600; letter-spacing:-0.015em; margin:10px 0 0;}
.screen .intro-lead{font-size:var(--text-body); color:var(--color-text-muted); margin:8px 0 0; max-width:56ch; line-height:1.6; text-wrap:pretty;}

.screen .card{background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm); overflow:hidden;}
.screen .card-head{padding:16px 18px 0;}
.screen .card-head .ch-row{display:flex; align-items:center; gap:10px;}
.screen .card-head .h{font-size:var(--text-h3); font-weight:600; line-height:1.2; flex:1 1 auto;}
.screen .card-head .d{font-size:var(--text-small); color:var(--color-text-muted); margin-top:4px; line-height:1.5; text-wrap:pretty;}
.screen .card-body{padding:16px 18px 18px;}

/* account card */
.screen .card .acct-id{display:flex; align-items:center; gap:14px;}
.screen .card .acct-id .who{flex:1 1 auto; min-width:0;}
.screen .card .acct-id .who .nm{font-size:var(--text-h3); font-weight:600; line-height:1.25; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .card .acct-id .who .hd{font-size:var(--text-small); color:var(--color-text-subtle); margin-top:2px;}
.screen .plan-badge{display:inline-flex; align-items:center; gap:6px; flex:0 0 auto; font-size:var(--text-caption); font-weight:600; letter-spacing:0.02em; color:var(--color-accent); background:color-mix(in srgb, var(--color-accent) 12%, var(--color-surface)); border:1px solid color-mix(in srgb, var(--color-accent) 28%, transparent); border-radius:var(--radius-full); padding:5px 11px; white-space:nowrap;}
/* two-row detail list (Email / Plan) */
.screen .set-rows{margin-top:16px; border-top:1px solid var(--color-border);}
.screen .set-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 0; border-bottom:1px solid var(--color-border);}
.screen .set-row:last-child{border-bottom:none;}
.screen .set-row .sr-k{font-size:var(--text-small); color:var(--color-text-muted);}
.screen .set-row .sr-v{font-size:var(--text-small); font-weight:600; color:var(--color-text); text-align:right;}

/* language grid (CODE BADGES, not flags) */
.screen .lang-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.screen .lang{display:flex; align-items:center; gap:12px; text-align:left; padding:10px 12px; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-surface); cursor:pointer; transition:background var(--duration-fast) var(--ease-standard), border-color var(--duration-fast) var(--ease-standard), box-shadow var(--duration-fast) var(--ease-standard);}
.screen .lang:hover{background:var(--color-surface-2); border-color:color-mix(in srgb, var(--color-text) 16%, var(--color-border));}
.screen .lang--active{border-color:var(--color-text); box-shadow:0 0 0 1px var(--color-text);}
.screen .lang-code{flex:0 0 auto; width:34px; height:34px; display:grid; place-items:center; font-family:var(--font-mono); font-size:13px; font-weight:500; letter-spacing:0.04em; color:var(--color-text-muted); border-radius:var(--radius-sm); background:var(--color-surface-2); border:1px solid var(--color-border);}
.screen .lang--active .lang-code{border-color:color-mix(in srgb, var(--color-text) 30%, var(--color-border)); color:var(--color-text);}
.screen .lang-txt{flex:1 1 auto; min-width:0;}
.screen .lang-nm{display:block; font-size:var(--text-small); font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .lang-rg{display:block; font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:1px;}
.screen .lang-tick{flex:0 0 auto; color:var(--color-text); opacity:0;}
.screen .lang--active .lang-tick{opacity:1;}

/* connected accounts */
.screen .acct-list{display:flex; flex-direction:column; margin-top:14px;}
.screen .acct-list .acct-row{display:flex; align-items:center; gap:13px; padding:13px 18px; border-top:1px solid var(--color-border); transition:background var(--duration-fast) var(--ease-standard), opacity var(--duration-slow) var(--ease-standard), transform var(--duration-slow) var(--ease-standard);}
.screen .acct-list .acct-row--leaving{opacity:0; transform:translateX(-8px);}
.screen .acct-main{flex:1 1 auto; min-width:0;}
.screen .acct-name{font-size:var(--text-small); font-weight:600; line-height:1.2; display:flex; align-items:center; gap:8px;}
.screen .acct-tag{font-size:11px; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; color:var(--color-text-muted); background:var(--color-surface-2); border:1px solid var(--color-border); border-radius:var(--radius-sm); padding:1px 6px;}
.screen .acct-sub{display:flex; align-items:center; gap:7px; font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:3px;}
.screen .acct-actions{flex:0 0 auto;}
.screen .disconnect-confirm{display:flex; align-items:center; gap:10px; flex:0 0 auto;}
.screen .disconnect-confirm .dc-msg{font-size:var(--text-caption); color:var(--color-danger); font-weight:500; white-space:nowrap;}
.screen .acct-foot{padding:14px 18px; border-top:1px solid var(--color-border); background:var(--color-surface-2);}
.screen .acct-empty{display:flex; flex-direction:column; align-items:center; text-align:center; padding:30px 22px 6px;}
.screen .acct-empty .ae-mark{width:46px; height:46px; display:grid; place-items:center; border-radius:var(--radius-lg); background:var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text-subtle); margin-bottom:12px;}
.screen .acct-empty .ae-title{font-size:var(--text-h3); font-weight:600;}
.screen .acct-empty .ae-sub{font-size:var(--text-small); color:var(--color-text-muted); margin-top:6px; max-width:40ch; line-height:1.5;}

/* shortcuts */
.screen .shortcut{display:flex; align-items:center; gap:14px; padding:15px 18px; border-top:1px solid var(--color-border);}
.screen .shortcut:first-child{border-top:none;}
.screen .shortcut:hover{background:var(--color-surface-2);}
.screen .shortcut-ico{flex:0 0 auto; width:38px; height:38px; display:grid; place-items:center; border-radius:var(--radius-md); background:var(--color-surface-2); border:1px solid var(--color-border); color:var(--color-text-muted);}
.screen .shortcut-ico.warn{color:var(--color-warning); background:color-mix(in srgb, var(--color-warning) 12%, var(--color-surface)); border-color:color-mix(in srgb, var(--color-warning) 26%, transparent);}
.screen .shortcut-txt{flex:1 1 auto; min-width:0;}
.screen .shortcut-t{font-size:var(--text-small); font-weight:600; display:flex; align-items:center; gap:8px;}
.screen .shortcut-d{font-size:var(--text-caption); color:var(--color-text-subtle); margin-top:2px; line-height:1.45;}
.screen .shortcut-d.warn{color:var(--color-warning);}
.screen .shortcut-act{flex:0 0 auto; margin-left:auto;}

/* skeleton */
.screen .skel-line,.screen .skel-block{border-radius:var(--radius-md); background:linear-gradient(90deg, var(--color-surface-2) 0%, color-mix(in srgb, var(--color-text) 7%, var(--color-surface-2)) 50%, var(--color-surface-2) 100%); background-size:220% 100%; animation:shimmer 1.4s linear infinite;}
.screen .skel-line{border-radius:var(--radius-sm);}
@keyframes shimmer{from{background-position:200% 0;}to{background-position:-200% 0;}}

/* ===================== ACCOUNT CONTROL (shell.css, scoped) ===================== */
.screen .account{display:flex; align-items:center; gap:10px; width:100%; padding:8px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; color:var(--color-text); cursor:pointer; text-align:left;}
.screen .account:hover,.screen .account.is-hover{background:var(--color-surface-2);}
.screen .account .who{min-width:0; flex:1 1 auto;}
.screen .account .who .nm{font-size:var(--text-small); font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .account .who .hd{font-size:var(--text-caption); color:var(--color-text-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .account .chev{margin-left:auto; color:var(--color-text-subtle); flex:0 0 auto; transition:transform var(--duration-base) var(--ease-standard);}
.screen .account.is-open .chev{transform:rotate(180deg);}
.screen .acct-menu{position:absolute; left:6px; right:6px; bottom:calc(100% + 8px); z-index:40; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); padding:6px; display:flex; flex-direction:column; gap:2px;}
.screen .acct-menu .acct-cap{font-size:var(--text-caption); font-weight:600; letter-spacing:0.06em; text-transform:uppercase; color:var(--color-text-subtle); padding:8px 10px 4px;}
.screen .acct-menu .acct-row{display:flex; align-items:center; gap:10px; width:100%; padding:7px 8px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; cursor:pointer; text-align:left; color:var(--color-text);}
.screen .acct-menu .acct-row:hover{background:var(--color-surface-2);}
.screen .acct-menu .acct-row .who{min-width:0; flex:1 1 auto;}
.screen .acct-menu .acct-row .who .nm{font-size:var(--text-small); font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .acct-menu .acct-row .who .hd{font-size:var(--text-caption); color:var(--color-text-subtle); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .acct-menu .acct-row .acct-check{flex:0 0 auto; color:var(--color-success);}
.screen .acct-menu .acct-row .acct-check--off{width:16px; flex:0 0 auto;}
.screen .acct-menu .acct-sep{height:1px; background:var(--color-border); margin:6px 4px;}
.screen .acct-menu .acct-link{display:flex; align-items:center; gap:10px; width:100%; padding:8px 10px; border-radius:var(--radius-md); border:1px solid transparent; background:transparent; font-size:var(--text-small); font-weight:500; color:var(--color-text); cursor:pointer; text-align:left; text-decoration:none;}
.screen .acct-menu .acct-link .al-ico{color:var(--color-text-subtle); flex:0 0 auto;}
.screen .acct-menu .acct-link:hover{background:var(--color-surface-2);}
.screen .acct-menu .acct-link--danger{color:var(--color-danger);}
.screen .acct-menu .acct-link--danger .al-ico{color:var(--color-danger);}
.screen .acct-menu .acct-link--danger:hover{background:color-mix(in srgb, var(--color-danger) 12%, var(--color-surface));}
.screen .acct-menu .acct-id{padding:8px 10px 4px;}
.screen .acct-menu .acct-id .ai-em{font-size:var(--text-small); font-weight:600; color:var(--color-text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.screen .acct-menu .acct-id .ai-plan{display:inline-flex; align-items:center; gap:6px; margin-top:3px; font-size:var(--text-caption); color:var(--color-text-subtle);}
.screen .acct-menu .acct-id .ai-plan .ai-dot{width:6px; height:6px; border-radius:var(--radius-full); background:var(--color-accent);}

.screen.mob .nav-item .nav-label,.screen.mob .nav-item .nav-badge,

.screen.mob .acct-list .acct-row{flex-wrap:wrap;}
.screen.mob .shortcut-act{margin-left:auto;}

/* ===================== data ===================== */

var LANGS=[
 {code:'EN',native:'English',label:'English'},
 {code:'ES',native:'Espa\u00F1ol',label:'Spanish'},

 {code:'FR',native:'Fran\u00E7ais',label:'French'},
 {code:'IT',native:'Italiano',label:'Italian'},
 {code:'PT',native:'Portugu\u00EAs',label:'Portuguese'},
 {code:'RU',native:'\u0420\u0443\u0441\u0441\u043A\u0438\u0439',label:'Russian'},
 {code:'UK',native:'\u0423\u043A\u0440\u0430\u0457\u043D\u0441\u044C\u043A\u0430',label:'Ukrainian'}
];
var ACCOUNTS=[
 {id:'mara',name:'Mara Lin',handle:'@mara.lin',initials:'ML',active:true},

];

 {cap:'Workspace',items:[['studio','Studio',4],['feed','My Feed',0],['replies','Replies',3],['at','Mentions',0]]},

 {cap:'Voice & automation',items:[['voice','Voice',0],['sliders','Style rules',0],['autopilot','Autopilot',0]]}
];
function navHtml(){
 return NAV.map(function(g){
  var items=g.items.map(function(it){
   var icon=it[0],label=it[1],badge=it[2];
   var bdg=badge?'<span class="nav-badge">'+badge+'</span>':'';
   return '<a class="nav-item"><span class="nav-ico">'+I(icon,16)+'</span><span class="nav-label">'+label+'</span>'+bdg+'</a>';
  }).join('');
  return '<div class="nav-cap">'+g.cap+'</div>'+items;
 }).join('');
}
function avatar(initials,size){
 size=size||32;
 return '<span class="avatar" style="width:'+size+'px;height:'+size+'px;"><span class="avatar-mono" style="font-size:'+Math.round(size*0.42)+'px;">'+esc(initials)+'</span></span>';

function accountButton(opts){
 opts=opts||{};
 var cls='account'+(opts.hover?' is-hover':'')+(opts.open?' is-open':'');
 var a=ACCOUNTS[0];
 return '<button class="'+cls+'">'+avatar(a.initials,32)+'<div class="who"><div class="nm">'+esc(a.name)+'</div><div class="hd">'+esc(a.handle)+'</div></div><span class="chev">'+I('chevD',15)+'</span></button>';

function intro(){
 return '<div class="intro"><span class="intro-eyebrow">Account</span><h1 class="intro-title">Settings</h1><p class="intro-lead">Manage your account, the language Pennedly speaks to you in, and the Threads accounts it writes for.</p></div>';
}
function accountCard(){
 return '<section class="card"><div class="card-head"><div class="ch-row"><span class="h">Account</span></div></div><div class="card-body">'
  +'<div class="acct-id">'+avatar('ML',52)+'<div class="who"><div class="nm">'+esc(USER.name)+'</div><div class="hd">'+esc(USER.email)+'</div></div><span class="plan-badge">'+I('star',13)+' '+esc(USER.plan)+'</span></div>'
  +'<div class="set-rows"><div class="set-row"><span class="sr-k">Email</span><span class="sr-v">'+esc(USER.email)+'</span></div><div class="set-row"><span class="sr-k">Plan</span><span class="sr-v">'+esc(USER.plan)+' \u00B7 '+esc(USER.planNote)+'</span></div></div>'
 +'</div></section>';

function languageCard(activeCode){
 var grid=LANGS.map(function(l){
  var active=l.code===activeCode;
  return '<button class="lang'+(active?' lang--active':'')+'"><span class="lang-code">'+esc(l.code)+'</span><span class="lang-txt"><span class="lang-nm">'+esc(l.native)+'</span><span class="lang-rg">'+esc(l.label)+'</span></span><span class="lang-tick">'+I('check',16)+'</span></button>';

 if(opts.confirming){
  actions='<div class="disconnect-confirm"><span class="dc-msg">Disconnect '+esc(a.handle)+'?</span><button class="btn btn--ghost btn--sm">Cancel</button><button class="btn btn--danger btn--sm">'+I('unlink',15)+' Disconnect</button></div>';

  actions='<button class="btn btn--ghost btn--sm">Disconnect</button>';

H+='<header class="doc-head">'
 +'<p class="doc-kicker">Pennedly · State spec · build contract</p>'
